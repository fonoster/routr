# TEMPORARY, CI diagnostic. SIPp segfaults at exit under SEET's execSync for the
# forged scenarios; try candidate workarounds through the same execSync path.
services:
  compliance:
    entrypoint: ["sh", "-c"]
    command:
      - |
        seet; rc=$$?
        echo "=== DIAG: suite exit $$rc"
        cd /
        ORIG=/scenarios/rr/uac_forged_in_dialog_invite.xml
        sed 's|<recv response="481" />|<recv response="481" />\n  <pause milliseconds="1000" />|' $$ORIG > /tmp/v_pause.xml
        sed 's|<recv response="481" />|<recv response="481" />\n  <timewait milliseconds="1000" />|' $$ORIG > /tmp/v_timewait.xml
        sed 's|<recv response="481" />|<recv response="481" />\n  <pause milliseconds="1000" />\n  <timewait milliseconds="1000" />|' $$ORIG > /tmp/v_both.xml
        cp $$ORIG /tmp/v_plain.xml
        run_one() {
          node -e '
            const { execSync } = require("child_process");
            try { execSync(process.argv[1], { timeout: 30000, stdio: "pipe" }); console.log(process.argv[2], "-> ok"); }
            catch (e) { console.log(process.argv[2], "-> status", e.status, "signal", e.signal, "stderr:", String(e.stderr).split("\n").slice(-2).join(" | ")); }
          ' "$$1" "$$2"
          rm -f /v_*_*.log /uac_forged_*.log
        }
        BASE='sip01.edgeport.net:5060 -p 5998 -m 1 -d 1 -t u1 -trace_err -trace_msg -timeout 30000 -set requestURI "sip:+12225553000@sip.provider.net;user=phone"'
        for i in 1 2 3; do
          echo "=== DIAG round $$i"
          run_one "sipp $$BASE -sf /tmp/v_plain.xml" "plain"
          run_one "sipp $$BASE -nostdin -sf /tmp/v_plain.xml" "nostdin"
          run_one "sipp $$BASE -sf /tmp/v_pause.xml" "pause"
          run_one "sipp $$BASE -sf /tmp/v_timewait.xml" "timewait"
          run_one "sipp $$BASE -sf /tmp/v_both.xml" "pause+timewait"
          run_one "sipp $$BASE -sf /scenarios/common/uac_invite.xml -set from sip:1001@sip.local -set to sip:17853178070@sip.local -au 1001 -ap 1234" "control: uac_invite"
        done
        exit $$rc
