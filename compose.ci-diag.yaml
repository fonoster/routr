# TEMPORARY, CI diagnostic for the forged in-dialog scenarios. After the suite, runs the
# same SIPp command the way SEET does (node execSync from /) and SEET itself on just
# those two tests, inside the same container.
services:
  compliance:
    entrypoint: ["sh", "-c"]
    command:
      - |
        seet; rc=$$?
        echo "=== DIAG: suite exit $$rc"
        cd /
        CMD='sipp sip01.edgeport.net:5060 -p 5998 -m 1 -d 1 -t u1 -trace_err -trace_msg -timeout 30000 -sf scenarios/rr/uac_forged_in_dialog_invite.xml -set requestURI "sip:+12225553000@sip.provider.net;user=phone"'
        echo "=== DIAG: execSync from / like SEET"
        node -e '
          const { execSync } = require("child_process");
          try { const out = execSync(process.argv[1], { timeout: 30000, stdio: "pipe" }); console.log("ok, stdout tail:", out.toString().slice(-200)); }
          catch (e) { console.log("status", e.status, "signal", e.signal); console.log("stderr:", String(e.stderr)); console.log("stdout tail:", String(e.stdout).slice(-400)); }
        ' "$$CMD"
        ls -l /uac_forged_in_dialog_invite_*; cat /uac_forged_in_dialog_invite_*_errors.log 2>/dev/null; rm -f /uac_forged_in_dialog_invite_*.log
        echo "=== DIAG: plain sh from / "
        sh -c "$$CMD" > /tmp/plain.out 2>&1; echo "exit $$?"; tail -4 /tmp/plain.out; ls -l /uac_forged_in_dialog_invite_*; rm -f /uac_forged_in_dialog_invite_*.log
        echo "=== DIAG: seet on the two forged tests only"
        node -e 'const t=require("/seet.json").filter(x=>x.name.includes("did not proxy")); require("fs").writeFileSync("/seet-forged.json", JSON.stringify(t));'
        SCENARIOS=/seet-forged.json seet 2>&1 | tail -40
        exit $$rc
