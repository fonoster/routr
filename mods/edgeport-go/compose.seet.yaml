# Runs the SEET compliance stack (compose.yaml + compose.dev.yaml) with the Go EdgePort
# in place of the Java one. Paths are relative to the repository root:
#
#   docker compose -f compose.yaml -f compose.dev.yaml -f mods/edgeport-go/compose.seet.yaml \
#     up --build -d
#
# The "SIP Connect v1.1 compliance (SEET, Go EdgePort)" job in .github/workflows/test.yaml
# uses it. Nothing else changes: same config files, addresses, certificates and suite.
services:
  edgeport01:
    image: routr-edgeport-go:compliance
    build:
      context: .
      dockerfile: ./mods/edgeport-go/Dockerfile

  edgeport02:
    image: routr-edgeport-go:compliance
    build:
      context: .
      dockerfile: ./mods/edgeport-go/Dockerfile
