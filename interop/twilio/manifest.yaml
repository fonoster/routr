  - file: twilio_dod-invite-tls-bye_twilio_20261119.jsonl
    profiles: [sip, sip-connect]
    findings: [sip-connect/request-uri-e164, sip/record-route-self, sip/private-address, sip-connect/from-e164-or-anonymous]
    replay: false
    draft: true
    note: >-
      Outbound call to Twilio over TLS from a Fonoster dev stack, answered, Fonoster hangs up (#732). The relayed Record-Route
      keeps Twilio's r2 and twnat, the ACK and BYE carry them in Route with a TLS Via, no 200 OK resends follow the ACK, and
      Twilio answers the BYE with 200. Roomr sends the BYE at 15 s (media_timeout): the dev stack's rtpengine offered its LAN
      address, so no RTP reached it. Lint-only: replaying it needs that stack's topology.
