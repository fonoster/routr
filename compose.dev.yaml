# Development overlay for Routr
services:
  edgeport01:
    container_name: edgeport01
    build:
      context: .
      dockerfile: ./cmd/edgeport/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      public:
        ipv4_address: 10.111.220.2
      internal:
        ipv4_address: 10.111.221.2
        aliases:
          - sip01.edgeport.net
    volumes:
      # Shared with the compliance container, which serves the same certificate as the
      # TLS carrier. The EdgePort builds its keystore from this directory at startup.
      - ./etc/certs:/etc/routr/certs

  edgeport02:
    container_name: edgeport02
    build:
      context: .
      dockerfile: ./cmd/edgeport/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      public:
        ipv4_address: 10.111.220.3
      internal:
        ipv4_address: 10.111.221.3
        aliases:
          - sip02.edgeport.net
    volumes:

  # The Go components (cmd/*): each reads its YAML through CONFIG_PATH, the image's
  # default (/etc/routr/<name>.yaml), and nothing from the environment (ROUTR3.md § 7),
  # so the LOGS_LEVEL and OTEL_EXPORTER_OTLP_ENDPOINT the Node services took are gone
  # here: the verbose logging is logLevel: debug in each YAML. Telemetry and call
  # recording return in milestone 3 (ROUTR3.md § 6).
  dispatcher:
    container_name: dispatcher
    build:
      context: .
      dockerfile: ./cmd/dispatcher/Dockerfile
    # The Node dispatcher recorded every call of the compliance run from the recording
    # section of this file; the Go one ignores that section until milestone 3, so the
    # CI's call-recordings artifact is empty for now
    volumes:
      - ./config/dispatcher.dev.yaml:/etc/routr/dispatcher.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.4

  location:
    container_name: location
    build:
      context: .
      dockerfile: ./cmd/location/Dockerfile
    volumes:
      - ./config/location.dev.yaml:/etc/routr/location.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.5

  # config/connect.yaml carries what compose.yaml gives the Node image as LOCATION_ADDR
  # and API_ADDR (spec.locationAddr, spec.apiAddr)
  connect:
    container_name: connect
    build:
      context: .
      dockerfile: ./cmd/connect/Dockerfile
    volumes:
      - ./config/connect.yaml:/etc/routr/connect.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.6

  # The Go Data API over the files backend (config/data.yaml), serving the same
  # resources compose.yaml mounts at /etc/routr/resources for simpledata
  apiserver:
    container_name: apiserver
    build:
      context: .
      dockerfile: ./cmd/data/Dockerfile
    volumes:
      - ./config/data.yaml:/etc/routr/data.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.8

  # Routr 2's published image (compose.yaml): nothing to build here, only its address
  requester:
    container_name: requester
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      internal:
        ipv4_address: 10.111.221.9

  registry:
    container_name: registry
    build:
      context: .
      dockerfile: ./mods/registry/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      internal:
        ipv4_address: 10.111.221.10

  # Media relay, as in a real deployment. The dispatcher (config/dispatcher.dev.yaml)
  # runs the rtprelay middleware, which drives RTPEngine. Nothing in the suite sends
  # media; what matters is the SDP RTPEngine negotiates, for example SRTP toward
  # a trunk that uses TLS (RR.Tst.Plan.1.2.2).
  rtpengine:
    container_name: rtpengine
    image: fonoster/rtpengine:0.3.17
    platform: linux/x86_64
    command: ["rtpengine", "--dtls-passive"]
    environment:
      RTPENGINE_PORT_MIN: 10000
      RTPENGINE_PORT_MAX: 10100
      RTPENGINE_PUBLIC_IP: 10.111.221.30
    networks:
      internal:
        ipv4_address: 10.111.221.30

  rtprelay:
    container_name: rtprelay
    build:
      context: .
      dockerfile: ./mods/rtprelay/Dockerfile
    depends_on:
      - rtpengine
    environment:
      LOGS_LEVEL: verbose
      RTPENGINE_HOST: rtpengine
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      internal:
        ipv4_address: 10.111.221.11

  # Traces, metrics and logs: Grafana on http://localhost:3000 (admin/admin)
  otel-lgtm:
    container_name: otel-lgtm
    image: grafana/otel-lgtm:0.38.0
    ports:
      - 3000:3000
    networks:
      internal:
        ipv4_address: 10.111.221.7

  #
  # SIP End to End Test (SEET) compliance test for SIPConnect v1.1 support
  # docker compose -f compose.yaml -f compose.dev.yaml up \
  #  --build --abort-on-container-exit --exit-code-from compliance compliance
  #
  compliance:
    container_name: compliance
    image: fonoster/seet:1.3.1
    depends_on:
      - edgeport01
      - edgeport02
      - dispatcher
      - registry
      - requester
      - apiserver
      - connect
      - location
      - rtprelay
    environment:
      SCENARIOS: /seet.json
    ports:
      - 7060:7060/udp
    volumes:
      # Milestone 1 runs the registration and agent-to-agent scenarios only
      # (config/seet.m1.json, derived from etc/seet.json): the Go Connect answers the
      # trunk, number and peer scenarios "not available until milestone 2", and the
      # SIPp UAS waiting for each of those calls holds port 7060 until its timeout, so
      # the agent-to-agent UAS that follows cannot bind. Milestone 2 restores
      # ./etc/seet.json here (ROUTR3.md § 6).
      - ./config/seet.m1.json:/seet.json
      - ./etc/scenarios:/scenarios
      # SIPp reads cacert.pem and cakey.pem from its working directory when a scenario
      # uses a TLS transport mode (l1). See .scripts/dev-certs.sh.
      - ./etc/certs/server.crt:/cacert.pem:ro
      - ./etc/certs/server.key:/cakey.pem:ro
    networks:
      internal:
        ipv4_address: 10.111.221.22
      public:
        ipv4_address: 10.111.220.22
        aliases:
          - sip.provider.net

networks:
  public:
    driver: "bridge"
    ipam:
      config:
        - subnet: 10.111.220.0/24
  internal:
    driver: "bridge"
    ipam:
      config:
        - subnet: 10.111.221.0/24
