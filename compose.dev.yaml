# Development overlay for Routr
services:
  edgeport01:
    container_name: edgeport01
    build:
      context: .
      dockerfile: ./cmd/edgeport/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      public:
        ipv4_address: 10.111.220.2
      internal:
        ipv4_address: 10.111.221.2
        aliases:
          - sip01.edgeport.net
    volumes:
      # Shared with the compliance container, which serves the same certificate as the
      # TLS carrier. The EdgePort builds its keystore from this directory at startup.
      - ./etc/certs:/etc/routr/certs

  edgeport02:
    container_name: edgeport02
    build:
      context: .
      dockerfile: ./cmd/edgeport/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    networks:
      public:
        ipv4_address: 10.111.220.3
      internal:
        ipv4_address: 10.111.221.3
        aliases:
          - sip02.edgeport.net
    volumes:

  # The Go components (cmd/*): each reads its YAML through CONFIG_PATH, the image's
  # default (/etc/routr/<name>.yaml), and nothing from the environment without a reference
  # in that file (ROUTR3.md § 7). OTEL_EXPORTER_OTLP_ENDPOINT below is such a reference,
  # ${OTEL_EXPORTER_OTLP_ENDPOINT:-} in each file's telemetry.otlpEndpoint. The verbose
  # logging is logLevel: debug in each YAML.
  dispatcher:
    container_name: dispatcher
    build:
      context: .
      dockerfile: ./cmd/dispatcher/Dockerfile
    environment: &telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    # Every call of the compliance run is recorded (spec.recording in the file) in this
    # volume, which starts out with the image's directory, owned by the image's user. The
    # CI collects it as the call-recordings artifact. DISPATCHER_CONFIG picks
    # config/dispatcher.relay.yaml, the same file with the rtprelay middleware on.
    volumes:
      - ${DISPATCHER_CONFIG:-./config/dispatcher.dev.yaml}:/etc/routr/dispatcher.yaml
      - traces:/var/routr/traces
    networks:
      internal:
        ipv4_address: 10.111.221.4

  location:
    container_name: location
    build:
      context: .
      dockerfile: ./cmd/location/Dockerfile
    environment: *telemetry
    volumes:
      - ./config/location.dev.yaml:/etc/routr/location.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.5

  # config/connect.dev.yaml trusts the EdgePorts and the Requester at their static addresses
  connect:
    container_name: connect
    build:
      context: .
      dockerfile: ./cmd/connect/Dockerfile
    environment: *telemetry
    volumes:
      - ./config/connect.dev.yaml:/etc/routr/connect.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.6

  # The Data API over the files backend (config/data.yaml), serving the resources
  # compose.yaml mounts at /etc/routr/resources
  apiserver:
    container_name: apiserver
    build:
      context: .
      dockerfile: ./cmd/data/Dockerfile
    environment: *telemetry
    volumes:
      - ./config/data.yaml:/etc/routr/data.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.8

  # sipHost in config/requester.dev.yaml is the address below: what goes in Via and Contact,
  # which the EdgePort answers to and config/connect.dev.yaml trusts
  requester:
    container_name: requester
    build:
      context: .
      dockerfile: ./cmd/requester/Dockerfile
    environment: *telemetry
    volumes:
      - ./config/requester.dev.yaml:/etc/routr/requester.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.9

  registry:
    container_name: registry
    build:
      context: .
      dockerfile: ./cmd/registry/Dockerfile
    environment: *telemetry
    volumes:
      - ./config/registry.dev.yaml:/etc/routr/registry.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.10

  # Media relay, as in a real deployment. The rtprelay middleware drives RTPEngine, but
  # the default dispatcher file leaves it off (config/dispatcher.dev.yaml says why); nothing
  # calls these two until DISPATCHER_CONFIG picks config/dispatcher.relay.yaml. Nothing in
  # the suite sends media; what matters is the SDP RTPEngine negotiates, for example SRTP
  # toward a trunk that uses TLS (RR.Tst.Plan.1.2.3).
  rtpengine:
    container_name: rtpengine
    image: fonoster/rtpengine:0.3.17
    platform: linux/x86_64
    command: ["rtpengine", "--dtls-passive"]
    environment:
      RTPENGINE_PORT_MIN: 10000
      RTPENGINE_PORT_MAX: 10100
      RTPENGINE_PUBLIC_IP: 10.111.221.30
    networks:
      internal:
        ipv4_address: 10.111.221.30

  rtprelay:
    container_name: rtprelay
    build:
      context: .
      dockerfile: ./cmd/rtprelay/Dockerfile
    depends_on:
      - rtpengine
    environment: *telemetry
    volumes:
      - ./config/rtprelay.yaml:/etc/routr/rtprelay.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.11

  # Traces, metrics and logs: Grafana on http://localhost:3000 (admin/admin)
  otel-lgtm:
    container_name: otel-lgtm
    image: grafana/otel-lgtm:0.38.0
    ports:
      - 3000:3000
    networks:
      internal:
        ipv4_address: 10.111.221.7

  #
  # SIP End to End Test (SEET) compliance test for SIPConnect v1.1 support
  # docker compose -f compose.yaml -f compose.dev.yaml up \
  #  --build --abort-on-container-exit --exit-code-from compliance compliance
  #
  compliance:
    container_name: compliance
    image: fonoster/seet:1.3.1
    depends_on:
      - edgeport01
      - edgeport02
      - dispatcher
      - registry
      - requester
      - apiserver
      - connect
      - location
      - rtprelay
    environment:
      SCENARIOS: /seet.json
    ports:
      - 7060:7060/udp
    volumes:
      - ./etc/seet.json:/seet.json
      - ./etc/scenarios:/scenarios
      # SIPp reads cacert.pem and cakey.pem from its working directory when a scenario
      # uses a TLS transport mode (l1). See .scripts/dev-certs.sh.
      - ./etc/certs/server.crt:/cacert.pem:ro
      - ./etc/certs/server.key:/cakey.pem:ro
    networks:
      internal:
        ipv4_address: 10.111.221.22
      public:
        ipv4_address: 10.111.220.22
        aliases:
          - sip.provider.net

volumes:
  traces:

networks:
  public:
    driver: "bridge"
    ipam:
      config:
        - subnet: 10.111.220.0/24
  internal:
    driver: "bridge"
    ipam:
      config:
        - subnet: 10.111.221.0/24
