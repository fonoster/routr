# Development overlay for Routr
services:
  edgeport01:
    container_name: edgeport01
    build:
      context: .
      dockerfile: ./mods/edgeport/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      public:
        ipv4_address: 10.111.220.2
      internal:
        ipv4_address: 10.111.221.2
        aliases:
          - sip01.edgeport.net
    volumes:
      # Shared with the compliance container, which serves the same certificate as the
      # TLS carrier. The EdgePort builds its keystore from this directory at startup.
      - ./etc/certs:/etc/routr/certs

  edgeport02:
    container_name: edgeport02
    build:
      context: .
      dockerfile: ./mods/edgeport/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      public:
        ipv4_address: 10.111.220.3
      internal:
        ipv4_address: 10.111.221.3
        aliases:
          - sip02.edgeport.net
    volumes:

  dispatcher:
    container_name: dispatcher
    build:
      context: .
      dockerfile: ./mods/dispatcher/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    # Records every call of the compliance run, unredacted and linted; CI
    # uploads the files and they are the candidates for etc/corpus
    volumes:
      - ./config/dispatcher.dev.yaml:/etc/routr/dispatcher.yaml
    networks:
      internal:
        ipv4_address: 10.111.221.4

  location:
    container_name: location
    build:
      context: .
      dockerfile: ./mods/location/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      internal:
        ipv4_address: 10.111.221.5

  connect:
    container_name: connect
    build:
      context: .
      dockerfile: ./mods/connect/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      internal:
        ipv4_address: 10.111.221.6

  apiserver:
    container_name: apiserver
    build:
      context: .
      dockerfile: ./mods/simpledata/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      internal:
        ipv4_address: 10.111.221.8

  requester:
    container_name: requester
    build:
      context: .
      dockerfile: ./mods/requester/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      internal:
        ipv4_address: 10.111.221.9

  registry:
    container_name: registry
    build:
      context: .
      dockerfile: ./mods/registry/Dockerfile
    environment:
      LOGS_LEVEL: verbose
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      internal:
        ipv4_address: 10.111.221.10

  # Media relay, as in a real deployment. The dispatcher (config/dispatcher.dev.yaml)
  # runs the rtprelay middleware, which drives RTPEngine. Nothing in the suite sends
  # media; what matters is the SDP RTPEngine negotiates, for example SRTP toward
  # a trunk that uses TLS (RR.Tst.Plan.1.2.2).
  rtpengine:
    container_name: rtpengine
    image: fonoster/rtpengine:0.3.17
    platform: linux/x86_64
    command: ["rtpengine", "--dtls-passive"]
    environment:
      RTPENGINE_PORT_MIN: 10000
      RTPENGINE_PORT_MAX: 10100
      RTPENGINE_PUBLIC_IP: 10.111.221.30
    networks:
      internal:
        ipv4_address: 10.111.221.30

  rtprelay:
    container_name: rtprelay
    build:
      context: .
      dockerfile: ./mods/rtprelay/Dockerfile
    depends_on:
      - rtpengine
    environment:
      LOGS_LEVEL: verbose
      RTPENGINE_HOST: rtpengine
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    networks:
      internal:
        ipv4_address: 10.111.221.11

  # Tracing monitoring
  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.54
    ports:
      - 16686:16686
      - 14268:14268
      - 14250:14250
    networks:
      internal:
        ipv4_address: 10.111.221.7

  #
  # SIP End to End Test (SEET) compliance test for SIPConnect v1.1 support
  # docker compose -f compose.yaml -f compose.dev.yaml up \
  #  --build --abort-on-container-exit --exit-code-from compliance compliance
  #
  compliance:
    container_name: compliance
    image: fonoster/seet:1.3.1
    depends_on:
      - edgeport01
      - edgeport02
      - dispatcher
      - registry
      - requester
      - apiserver
      - connect
      - location
      - rtprelay
    environment:
      SCENARIOS: /seet.json
    ports:
      - 7060:7060/udp
    volumes:
      - ./etc/seet.json/:/seet.json
      - ./etc/scenarios:/scenarios
      # SIPp reads cacert.pem and cakey.pem from its working directory when a scenario
      # uses a TLS transport mode (l1). See .scripts/dev-certs.sh.
      - ./etc/certs/server.crt:/cacert.pem:ro
      - ./etc/certs/server.key:/cakey.pem:ro
    networks:
      internal:
        ipv4_address: 10.111.221.22
      public:
        ipv4_address: 10.111.220.22
        aliases:
          - sip.provider.net

networks:
  public:
    driver: "bridge"
    ipam:
      config:
        - subnet: 10.111.220.0/24
  internal:
    driver: "bridge"
    ipam:
      config:
        - subnet: 10.111.221.0/24
