# RoutrOne soak: the whole stack in one image (EdgePort, Dispatcher, Connect,
# Location, the API Server and its internal PostgreSQL). perfkit runs it on the
# UUT droplet with the PERFKIT_* variables set (see perf/README.md), then runs
# seed.js. Host networking only: Docker's UDP port publishing distorts results
# at these rates, and perfkit refuses a service without it.
services:
  routr:
    image: ${PERFKIT_IMAGE_ONE:?set PERFKIT_IMAGE_ONE}
    network_mode: host
    restart: "no"
    environment:
      JAVA_TOOL_OPTIONS: -Xms1g -Xmx1g -XX:+AlwaysPreTouch
      EXTERNAL_ADDRS: ${PERFKIT_UUT_IP:?set PERFKIT_UUT_IP}
      LOCALNETS: ${PERFKIT_VPC_CIDR:-127.0.0.1/8}
      LOGS_LEVEL: info
      ENABLE_HEALTHCHECKS: "true"
      # Empty (no telemetry in perfkit.yaml, or a laptop run) turns telemetry off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${PERFKIT_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${PERFKIT_TRACE_RATIO:-0.01}
      # RTPENGINE_HOST stays unset: no media relay, signaling only.
    healthcheck:
      # Healthy once the API Server (seed.js needs it) and the EdgePort answer.
      test:
        - CMD
        - node
        - -e
        - >-
          const net = require("net");
          const http = require("http");
          const fail = () => process.exit(1);
          net.connect(51908, "127.0.0.1").on("error", fail).on("connect", () =>
          http.get("http://127.0.0.1:8080/healthz", (r) =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on("error", fail));
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
