# RoutrOne soak: every component in one binary, with the files backend and no
# RTPEngine (signaling only). perfkit runs it on the UUT droplet with the
# PERFKIT_* variables set (see perf/README.md). Host networking only: Docker's
# UDP port publishing distorts results at these rates, and perfkit refuses a
# service without it.
services:
  routr:
    image: ${PERFKIT_IMAGE_ONE:?set PERFKIT_IMAGE_ONE}
    network_mode: host
    restart: "no"
    environment:
      PERFKIT_UUT_IP: ${PERFKIT_UUT_IP:?set PERFKIT_UUT_IP}
      PERFKIT_OTLP_ENDPOINT: ${PERFKIT_OTLP_ENDPOINT:-}
    volumes:
      - ./routr.yaml:/etc/routr/routr.yaml:ro
      - ./resources:/etc/routr/resources:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
