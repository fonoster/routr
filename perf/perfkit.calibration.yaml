apiVersion: perfkit/v1
project:
  name: Routr
  repo: fonoster/routr
  siteUrl: https://routr.io/benchmarks
  accent: "#5FCFCE"               # 6-digit hex; the page's accent color
  logo: logo.svg                  # optional SVG; without it the nav shows project.name
  title: How much SIP traffic Routr handles.
  lead: We run these tests after significant changes to the code, on dedicated DigitalOcean servers, one for Routr and one for the load generator. The EdgePort runs alone to find its limit; the whole stack runs for hours to catch leaks.
infra:
  provider: digitalocean          # the only provider in v1
  region: nyc3
  uut: { size: c-8 }              # unit under test, a dedicated-CPU slug
  loadgen: { size: c-16 }         # load generator
  maxLifetime: 9h                 # sweep deletes this run's droplets after this
images:                           # tag comes from --target-version, pinned by digest at start
  edgeport: fonoster/routr-edgeport
  echo: fonoster/routr-echo
  one: fonoster/routr-one
  edgeportGo:                     # the experimental Go EdgePort (mods/edgeport-go)
    name: fonoster/routr-edgeport
    tagSuffix: -go-experimental
benchmarks:
  - id: edgeport-echo
    kind: capacity
    title: EdgePort + Echo
    narrative:
      what: The EdgePort (Java) on its own, with Echo answering every request with 200 OK. No Dispatcher, Connect or database, so this is a ceiling for EdgePort alone, not for a full deployment.
      why: The EdgePort is the only stateful piece of Routr. When it saturates, calls fail, no matter what runs behind it.
      how: "Calibration run: SIPp sends SIP MESSAGE requests over UDP, starting at 500 messages/s and adding 100 every 30 s, up to 3,000 messages/s. The first 20 s warm the EdgePort up and are not measured. The run stops at the first step where p99 MESSAGE-to-200 latency reaches 50 ms or failed requests reach 0.1%."
    uut:
      compose: edgeport-echo/compose.yaml
      processes:                  # sampled every 10 s; match is a regex on the command line
        - { name: edgeport, match: "io\\.routr\\.Launcher" }
        - { name: echo, match: "/usr/local/bin/run" }
    load:
      tool: sipp
      transport: udp
      port: 5060
      uac: { scenario: edgeport-echo/uac_message.xml }
      unit: messages
      rate: { start: 500, step: 100, every: 30s, max: 3000 }
    warmup: 20s                   # the EdgePort starts cold; not measured
    thresholds: { p99LatencyMs: 50, failedCallsPct: 0.1 }
  - id: edgeport-go-echo
    kind: capacity
    title: EdgePort (Go, experimental) + Echo
    narrative:
      what: "Experimental: the Go EdgePort (mods/edgeport-go), a candidate replacement for the Java EdgePort, not the default and not released for production. Same setup as EdgePort + Echo: Echo answers every request with 200 OK, so this is a ceiling for the Go EdgePort alone."
      why: The EdgePort is the only stateful piece of Routr. When it saturates, calls fail, no matter what runs behind it.
      how: "Calibration run: SIPp sends SIP MESSAGE requests over UDP, starting at 1,000 messages/s and adding 250 every 30 s, up to 10,000 messages/s. The first 20 s warm the EdgePort up and are not measured. The run stops at the first step where p99 MESSAGE-to-200 latency reaches 50 ms or failed requests reach 0.1%."
    uut:
      compose: edgeport-go-echo/compose.yaml
      processes:                  # sampled every 10 s; match is a regex on the command line
        - { name: edgeport, match: "/opt/routr/edgeport( |$)" }
        - { name: echo, match: "/usr/local/bin/run" }
    load:
      tool: sipp
      transport: udp
      port: 5060
      uac: { scenario: edgeport-echo/uac_message.xml }
      unit: messages
      rate: { start: 1000, step: 250, every: 30s, max: 10000 }
    warmup: 20s                   # the EdgePort starts cold; not measured
    thresholds: { p99LatencyMs: 50, failedCallsPct: 0.1 }
  - id: one-soak
    kind: soak
    title: RoutrOne, 1 hour
    narrative:
      what: The whole stack in one image, EdgePort plus Dispatcher, Connect, Location and the data service in one Node process, routing calls between registered agents.
      why: Leaks only show after hours. A short test can pass while memory climbs until the process is killed in production.
      how: "Calibration run: SIPp holds a steady 5 calls/s for 1 hour, with 200 registered callee agents, each called by its own caller agent through Connect. After a 15-minute warm-up, each process's memory may grow at most 5 MB/h."
    duration: 1h
    warmup: 15m                   # excluded from every verdict
    uut:
      compose: one-soak/compose.yaml
      setup: one-soak/seed.js   # optional; runs once the UUT is up
      processes:
        - { name: one, match: "dist/runner" }
        - { name: edgeport, match: "io\\.routr\\.Launcher" }
        - { name: postgres, match: "postgres" }   # all matching processes are summed
    load:
      tool: sipp
      transport: udp
      register: { scenario: one-soak/uac_register.xml, users: one-soak/callees.csv, expires: 300 }
      uas: { scenario: one-soak/uas_answer.xml }
      uac: { scenario: one-soak/uac_invite.xml, users: one-soak/callers.csv }
      hold: 30s
      rate: { cps: 5 }            # 18,000 calls in the hour; about 50 SIP messages/s, far under the EdgePort's limit
    telemetry: { otlp: true, sampleRatio: 0.01 }
    thresholds: { memoryGrowthMBPerHour: 5, failedCallsPct: 0.1, restarts: 0 }
