# EdgePort for the edgeport-echo benchmark. externalAddrs and localnets come
# from the PERFKIT_* variables compose.yaml passes, through placeholders; the
# health check is what compose's healthcheck polls.
kind: EdgePort
apiVersion: v2beta1
ref: edgeport-bench
metadata:
  region: default
spec:
  unknownMethodAction: Discard
  processor:
    addr: 127.0.0.1:51904
  securityContext:
    client:
      authType: DisabledAll
    keyStorePassword: changeme
    keyStore: "/etc/routr/certs/signaling.p12"
    keyStoreType: pkcs12
  externalAddrs:
    - "${PERFKIT_UUT_IP}"
  localnets:
    - "${PERFKIT_VPC_CIDR:-127.0.0.1/8}"
  health:
    bindAddr: 0.0.0.0:8080
  methods:
    - MESSAGE
    - REGISTER
    - INVITE
    - ACK
    - BYE
    - CANCEL
  transport:
    - protocol: udp
      port: 5060
    - protocol: tcp
      port: 5060
