{{- if .Values.rtprelay.enabled }}
{{- if not .Values.rtprelay.rtpeHost }}
{{- fail "rtprelay.rtpeHost is required when rtprelay.enabled is true: the RTPEngine instance the relay drives." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-rtprelay-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  rtprelay.yaml: |-
    kind: RTPRelay
    apiVersion: v2beta1
    logLevel: {{ include ".helm.logLevel" . }}
    {{- include ".helm.telemetry" . | nindent 4 }}
    spec:
      bindAddr: 0.0.0.0:51903
      rtpengine:
        host: {{ .Values.rtprelay.rtpeHost | quote }}
        port: {{ .Values.rtprelay.rtpePort }}
      {{- with .Values.rtprelay.profiles }}
      profiles:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
