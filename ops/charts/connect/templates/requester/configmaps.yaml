{{- if .Values.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-requester-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  # No sipHost: the pod's own IP, which the headless Service in connect.trustedRegistryAddresses resolves to
  requester.yaml: |-
    kind: Requester
    apiVersion: v2beta1
    logLevel: {{ include ".helm.logLevel" . }}
    {{- include ".helm.telemetry" . | nindent 4 }}
    metadata:
      region: {{ .Values.global.region }}
    spec:
      bindAddr: 0.0.0.0:51909
      apiKeys:
        - {{ include ".helm.apiKeyRef" . }}
{{- end }}
