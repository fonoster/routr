{{- if .Values.registry.enabled }}
# What connect.trustedRegistryAddresses names by default: exactly the Requester's pods, ready
# or not, since a pod sends its first REGISTER as soon as it starts.
# The Registry dials it too, round robin over the pods; one not ready yet refuses the connection
# and gets no calls.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-routr-requester-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
    service: requester
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include ".helm.selectorLabels" . | nindent 4 }}
    service: requester
  ports:
  - port: 51909
    targetPort: 51909
{{- end }}
