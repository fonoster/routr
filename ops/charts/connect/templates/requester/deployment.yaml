{{- if .Values.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-routr-requester
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
    service: requester
spec:
  {{- include ".helm.replicas" (dict "ctx" . "component" "requester") | nindent 2 }}
  selector:
    matchLabels:
      {{- include ".helm.selectorLabels" . | nindent 6 }}
      service: requester
  template:
    metadata:
      annotations:
      {{- with .Values.requester.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/requester/configmaps.yaml") . | sha256sum | quote }}
        checksum/api-key: {{ .Values.apiserver.apiKey | default "" | sha256sum | quote }}
      labels:
        {{- include ".helm.selectorLabels" . | nindent 8 }}
        service: requester
    spec:
      securityContext:
        runAsUser: {{ .Values.requester.securityContext.runAsUser }}
        runAsGroup: {{ .Values.requester.securityContext.runAsGroup }}
        fsGroup: {{ .Values.requester.securityContext.fsGroup }}
      containers:
        - name: requester
          image: "{{ .Values.requester.image.repository }}:{{ .Values.requester.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.requester.image.pullPolicy }}
          livenessProbe:
            grpc:
              port: 51909
            initialDelaySeconds: {{ .Values.requester.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.requester.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.requester.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.requester.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.requester.livenessProbe.timeoutSeconds }}
          readinessProbe:
            grpc:
              port: 51909
            initialDelaySeconds: {{ .Values.requester.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.requester.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.requester.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.requester.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.requester.readinessProbe.timeoutSeconds }}
          ports:
            - containerPort: 51909
          volumeMounts:
            - name: config
              mountPath: /etc/routr/requester.yaml
              subPath: requester.yaml
            {{- include ".helm.apiKeyVolumeMount" . | nindent 12 }}
          resources:
            {{- if .Values.requester.resources.limits }}
            limits:
            {{- .Values.requester.resources.limits | toYaml | nindent 14 }}
            {{- end }}
            {{- if .Values.requester.resources.requests }}
            requests:
            {{- .Values.requester.resources.requests | toYaml | nindent 14 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.requester.securityContext.allowPrivilegeEscalation }}         
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-routr-requester-config
        {{- include ".helm.apiKeyVolume" . | nindent 8 }}
{{- end }}
