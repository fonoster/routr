{{- if and .Values.apiserver.verifyClientCert (not .Values.apiserver.tlsOn) }}
{{- fail "apiserver.verifyClientCert is true, but apiserver.tlsOn is false: a client certificate needs TLS." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-apiserver-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  data.yaml: |-
    apiVersion: v3
    kind: Routr
    logLevel: {{ include ".helm.logLevel" . }}
    {{- include ".helm.telemetry" . | nindent 4 }}
    spec:
      data:
        bindAddr: 0.0.0.0:51907
        apiKeys:
          - {{ include ".helm.apiKeyRef" . }}
        {{- if .Values.apiserver.tlsOn }}
        tls:
          certFile: /etc/routr/certs/apiserver/tls.crt
          keyFile: /etc/routr/certs/apiserver/tls.key
          {{- if .Values.apiserver.verifyClientCert }}
          clientCAFile: /etc/routr/certs/apiserver/ca.crt
          {{- end }}
        {{- end }}
        backend: postgres
        url: {{ printf "secret://k8s/%s-routr-database-url#DATABASE_URL" .Release.Name | quote }}
        {{- if .Values.apiserver.cloakEncryptionKey }}
        encryptionKey: {{ printf "secret://k8s/%s-routr-database-url#CLOAK_ENCRYPTION_KEY" .Release.Name | quote }}
        {{- end }}
