apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-routr-apiserver
  namespace: {{ .Release.Namespace }}  
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
    service: apiserver
spec:
  {{- include ".helm.replicas" (dict "ctx" . "component" "apiserver") | nindent 2 }}
  selector:
    matchLabels:
      {{- include ".helm.selectorLabels" . | nindent 6 }}
      service: apiserver
  template:
    metadata:
      annotations:
      {{- with .Values.apiserver.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/apiserver/configmaps.yaml") . | sha256sum | quote }}
        checksum/secrets: {{ include (print $.Template.BasePath "/apiserver/secrets.yaml") . | sha256sum | quote }}
        checksum/api-key: {{ .Values.apiserver.apiKey | default "" | sha256sum | quote }}
      labels:
        {{- include ".helm.selectorLabels" . | nindent 8 }}
        service: apiserver
    spec:
      {{- include ".helm.topologySpread" (dict "ctx" . "component" "apiserver") | nindent 6 }}
      securityContext:
        runAsUser: {{ .Values.apiserver.securityContext.runAsUser }}
        runAsGroup: {{ .Values.apiserver.securityContext.runAsGroup }}
        fsGroup: {{ .Values.apiserver.securityContext.fsGroup }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-database
          image: {{ include ".helm.migrationsImage" . | quote }}
          imagePullPolicy: {{ .Values.apiserver.migrations.image.pullPolicy }}
          resources:
            {{- if .Values.apiserver.migrations.resources.requests  }}
            requests:
            {{- .Values.apiserver.migrations.resources.requests | toYaml | nindent 14 }}
            {{- end }}
            {{- if .Values.apiserver.migrations.resources.limits }}
            limits:
            {{- .Values.apiserver.migrations.resources.limits | toYaml | nindent 14 }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h {{ .Release.Name }}-postgresql.{{ .Release.Namespace }} -p 5432 -U {{ .Values.postgresql.auth.username }} >/dev/null 2>&1; do
                echo "Waiting for the database..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: apiserver
          image: "{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          {{- with .Values.apiserver.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if .Values.apiserver.tlsOn }}
            # A Kubernetes grpc probe can't speak TLS
            tcpSocket:
              port: 51907
            {{- else }}
            grpc:
              port: 51907
            {{- end }}
            initialDelaySeconds: {{ .Values.apiserver.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiserver.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.apiserver.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.apiserver.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.apiserver.livenessProbe.timeoutSeconds }}
          readinessProbe:
            {{- if .Values.apiserver.tlsOn }}
            # A Kubernetes grpc probe can't speak TLS
            tcpSocket:
              port: 51907
            {{- else }}
            grpc:
              port: 51907
            {{- end }}
            initialDelaySeconds: {{ .Values.apiserver.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiserver.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.apiserver.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.apiserver.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.apiserver.readinessProbe.timeoutSeconds }}
          ports:
            - containerPort: 51907
          volumeMounts:
            - name: config
              mountPath: /etc/routr/data.yaml
              subPath: data.yaml
            # The secret:// references of data.yaml, under the directory they resolve from
            - name: database-secret
              mountPath: /var/run/routr/secrets/{{ .Release.Name }}-routr-database-url
              readOnly: true
            {{- include ".helm.apiKeyVolumeMount" . | nindent 12 }}
            {{- if .Values.apiserver.tlsOn }}
            - name: tls
              mountPath: /etc/routr/certs/apiserver
              readOnly: true
            {{- end }}
          resources:
            {{- if .Values.apiserver.resources.limits }}
            limits:
            {{- .Values.apiserver.resources.limits | toYaml | nindent 14 }}
            {{- end }}
            {{- if .Values.apiserver.resources.requests }}
            requests:
            {{- .Values.apiserver.resources.requests | toYaml | nindent 14 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.apiserver.securityContext.allowPrivilegeEscalation }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-routr-apiserver-config
        - name: database-secret
          secret:
            secretName: {{ .Release.Name }}-routr-database-url
            defaultMode: 0440
        {{- include ".helm.apiKeyVolume" . | nindent 8 }}
        {{- if .Values.apiserver.tlsOn }}
        - name: tls
          secret:
            secretName: {{ include ".helm.apiserverTLSSecret" . }}
            defaultMode: 0440
        {{- end }}
