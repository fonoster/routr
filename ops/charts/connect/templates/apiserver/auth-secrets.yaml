{{- if and .Values.apiserver.apiKey .Values.apiserver.apiKeySecret }}
{{- fail "apiserver.apiKey and apiserver.apiKeySecret are both set: use one." }}
{{- end }}
{{- /* With apiKeySecret the pods mount that Secret, which the chart neither reads nor writes */ -}}
{{- if not .Values.apiserver.apiKeySecret }}
{{- /* Generated once: a render without the cluster, such as helm template, gets new values */ -}}
{{- /* An upgrade keeps the key the first install generated, so no client loses its way */ -}}
{{- $apiKeySecret := include ".helm.apiKeySecret" . }}
{{- $existingKey := lookup "v1" "Secret" .Release.Namespace $apiKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $apiKeySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
  annotations:
    {{- /* Kept when a later upgrade sets apiKeySecret, and on uninstall: the key survives both */}}
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.apiserver.apiKey }}
  apiKey: {{ .Values.apiserver.apiKey | b64enc | quote }}
  {{- else if and $existingKey $existingKey.data (index $existingKey.data "apiKey") }}
  apiKey: {{ index $existingKey.data "apiKey" | quote }}
  {{- else }}
  apiKey: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.apiserver.tlsOn (not .Values.apiserver.tlsSecret) }}
---
{{- /* The same for the certificate: clients already trust this CA */ -}}
{{- $tlsSecret := include ".helm.apiserverTLSSecret" . }}
{{- $existingTLS := lookup "v1" "Secret" .Release.Namespace $tlsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existingTLS $existingTLS.data (index $existingTLS.data "tls.crt") }}
  ca.crt: {{ index $existingTLS.data "ca.crt" | quote }}
  tls.crt: {{ index $existingTLS.data "tls.crt" | quote }}
  tls.key: {{ index $existingTLS.data "tls.key" | quote }}
  {{- else }}
  {{- $service := printf "%s-routr-apiserver" .Release.Name }}
  {{- $names := list "localhost" $service (printf "%s.%s" $service .Release.Namespace) (printf "%s.%s.svc" $service .Release.Namespace) (printf "%s.%s.svc.cluster.local" $service .Release.Namespace) }}
  {{- $ca := genCA (printf "%s-routr-apiserver-ca" .Release.Name) 3650 }}
  {{- $cert := genSignedCert $service (list "127.0.0.1") $names 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  {{- end }}
{{- end }}
