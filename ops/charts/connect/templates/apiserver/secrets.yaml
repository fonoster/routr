apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-routr-database-url
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Read by the migrations (DATABASE_URL, Prisma) and, as a secret:// reference, by the
  # Data API (pgx). Prisma's schema defaults to public, so the chart's own URL names none.
  {{- if .Values.apiserver.databaseUrl }}
  DATABASE_URL: {{ .Values.apiserver.databaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql.%s:5432/routr" .Values.postgresql.auth.username .Values.postgresql.auth.password .Release.Name .Release.Namespace | quote }}
  {{- end }}
  {{- with .Values.apiserver.cloakEncryptionKey }}
  CLOAK_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
