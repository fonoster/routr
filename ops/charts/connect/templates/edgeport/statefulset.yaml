apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-routr-edgeport
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
    service: edgeport
spec:
  replicas: {{ .Values.edgeport.replicas }}
  selector:
    matchLabels:
      {{- include ".helm.selectorLabels" . | nindent 6 }}
      service: edgeport
  serviceName: {{ .Release.Name }}-routr-edgeport-headless
  minReadySeconds: {{ .Values.edgeport.minReadySeconds }}
  template:
    metadata:
      annotations:
      {{- with .Values.edgeport.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/edgeport/configmaps.yaml") . | sha256sum | quote }}
      labels:
        {{- include ".helm.selectorLabels" . | nindent 8 }}
        service: edgeport
    spec:
      securityContext:
        runAsUser: {{ .Values.edgeport.securityContext.runAsUser }}
        runAsGroup: {{ .Values.edgeport.securityContext.runAsGroup }}
        fsGroup: {{ .Values.edgeport.securityContext.fsGroup }}
      terminationGracePeriodSeconds: {{ .Values.edgeport.terminationGracePeriodSeconds }}
      # Never two EdgePorts on one node: each node's share of the load balancer's traffic
      # (externalTrafficPolicy Local) goes to its own EdgePort, and a node lost takes one
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include ".helm.selectorLabels" . | nindent 18 }}
                  service: edgeport
      containers:
        - name: edgeport
          image: "{{ .Values.edgeport.image.repository }}:{{ .Values.edgeport.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.edgeport.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ .Values.edgeport.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.edgeport.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.edgeport.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.edgeport.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.edgeport.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ .Values.edgeport.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.edgeport.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.edgeport.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.edgeport.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.edgeport.readinessProbe.timeoutSeconds }}
          env:
            # The pod's own IP, for edgeport.localnets entries written as ${POD_IP}/<prefix>
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with .Values.edgeport.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
            {{- include ".helm.edgeportPorts" (dict "ctx" . "transports" (list "udp" "tcp" "tls" "ws" "wss") "container" true) | trim | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/routr/edgeport.yaml
              subPath: edgeport.yaml
            {{- with (.Values.edgeport.tls | default dict).secretName }}
            # The whole directory, no subPath, so a renewed Secret reaches the pod
            - name: tls
              mountPath: /etc/routr/tls
              readOnly: true
            {{- end }}
          resources:
            {{- if .Values.edgeport.resources.limits }}
            limits:
            {{- .Values.edgeport.resources.limits | toYaml | nindent 14 }}
            {{- end }}
            {{- if .Values.edgeport.resources.requests }}
            requests:
            {{- .Values.edgeport.resources.requests | toYaml | nindent 14 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.edgeport.securityContext.allowPrivilegeEscalation }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-routr-edgeport-config
        {{- with (.Values.edgeport.tls | default dict).secretName }}
        - name: tls
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
