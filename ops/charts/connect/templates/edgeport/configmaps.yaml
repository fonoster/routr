{{- $name := .Values.edgeport.methods | required ".Values.edgeport.methods is required." -}}
{{- $tls := .Values.edgeport.tls | default dict -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-edgeport-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  edgeport.yaml: |
    kind: EdgePort
    apiVersion: v3
    # The pod's name, so each replica of the StatefulSet has its own ref
    ref: ${HOSTNAME}
    logLevel: {{ include ".helm.logLevel" . }}
    {{- include ".helm.telemetry" . | nindent 4 }}
    metadata:
      region: {{ .Values.global.region }}
    spec:
      unknownMethodAction: {{ .Values.edgeport.unknownMethodAction | default "Discard" }}
      # The liveness and readiness probes of the StatefulSet
      health:
        bindAddr: 0.0.0.0:8080
      # The localnets read from the pod's interfaces leave loopback out
      ignoreLoopbackFromLocalnets: true
      {{- if eq (include ".helm.edgeportCacheProvider" .) "redis" }}
      # The dialog table, shared: a call set up through one pod, or before a restart,
      # can still send its BYE through any of them
      cache:
        provider: redis
        parameters: {{ include ".helm.redisParameters" (dict "ctx" . "component" "edgeport" "parameters" (.Values.edgeport.cache | default dict).parameters) | quote }}
      {{- end }}
      processor:
        # Straight to Connect unless the Dispatcher is on (recording, middlewares), at its
        # headless Service: every pod, round robin
        {{- if .Values.dispatcher.enabled }}
        addr: {{ include ".helm.headlessAddr" (dict "ctx" . "component" "dispatcher" "port" 51901) }}
        {{- else }}
        addr: {{ include ".helm.headlessAddr" (dict "ctx" . "component" "connect" "port" 51904) }}
        {{- end }}
      securityContext:
        client:
          authType: DisabledAll
          {{- with $tls.protocols }}
          protocols:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $tls.cipherSuites }}
          cipherSuites:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        keyStorePassword: {{ printf "secret://k8s/%s-routr-edgeport-pkcs12-password#password" .Release.Name | quote }}
        keyStore: "/etc/routr/certs/signaling.p12"
        keyStoreType: pkcs12
        # No trustStore: the system's public CAs apply, so calls to carriers over TLS are trusted
      {{- if .Values.edgeport.externalAddrs }}
      externalAddrs:
      {{- range .Values.edgeport.externalAddrs }}
        - {{.}}
      {{- end }}
      {{- end }}
      {{- with include ".helm.edgeportLocalnets" . }}
      # edgeport.localnets, or the pod's own IP with the prefix of edgeport.podCIDR, so the
      # EdgePort reaches every pod of the network: callees and the other EdgePorts
      localnets: {{ . }}
      {{- end }}
      # The name the Registry's Route carries (registry/configmaps.yaml), so Connect
      # takes it for this EdgePort instead of sending the REGISTER back here
      aliases:
        - {{ .Release.Name }}-routr-edgeport.{{ .Release.Namespace }}
      {{- if .Values.edgeport.methods }}
      methods:
      {{- range .Values.edgeport.methods }}
        - {{.}}
      {{- end }}
      {{- end }}
      transport:
      {{- if .Values.edgeport.transport.tcp.enabled }}
        - protocol: tcp
          port: {{ .Values.edgeport.transport.tcp.port }}
      {{- end }}
      {{- if .Values.edgeport.transport.udp.enabled }}
        - protocol: udp
          port: {{ .Values.edgeport.transport.udp.port }}
      {{- end }}
      {{- if .Values.edgeport.transport.tls.enabled }}
        - protocol: tls
          port: {{ .Values.edgeport.transport.tls.port }}
      {{- end }}      
      {{- if .Values.edgeport.transport.ws.enabled }}
        - protocol: ws
          port: {{ .Values.edgeport.transport.ws.port }}
      {{- end }}
      {{- if .Values.edgeport.transport.wss.enabled }}
        - protocol: wss
          port: {{ .Values.edgeport.transport.wss.port }}
      {{- end }}
