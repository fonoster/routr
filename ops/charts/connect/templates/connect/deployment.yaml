apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-routr-connect
  namespace: {{ .Release.Namespace }}  
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
    service: connect
spec:
  {{- include ".helm.replicas" (dict "ctx" . "component" "connect") | nindent 2 }}
  selector:
    matchLabels:
      {{- include ".helm.selectorLabels" . | nindent 6 }}
      service: connect
  template:
    metadata:
      annotations: 
      {{- with .Values.connect.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/connect/configmaps.yaml") . | sha256sum | quote }}
        checksum/api-key: {{ .Values.apiserver.apiKey | default "" | sha256sum | quote }}
      labels:
        {{- include ".helm.selectorLabels" . | nindent 8 }}
        service: connect
    spec:
      {{- include ".helm.topologySpread" (dict "ctx" . "component" "connect") | nindent 6 }}
      securityContext:
        runAsUser: {{ .Values.connect.securityContext.runAsUser }}
        runAsGroup: {{ .Values.connect.securityContext.runAsGroup }}
        fsGroup: {{ .Values.connect.securityContext.fsGroup }}
      containers:
        - name: connect
          image: "{{ .Values.connect.image.repository }}:{{ .Values.connect.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.connect.image.pullPolicy }}
          {{- with .Values.connect.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            grpc:
              port: 51904
            initialDelaySeconds: {{ .Values.connect.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.connect.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.connect.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.connect.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.connect.livenessProbe.timeoutSeconds }}
          readinessProbe:
            grpc:
              port: 51904
            initialDelaySeconds: {{ .Values.connect.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.connect.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.connect.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.connect.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.connect.readinessProbe.timeoutSeconds }}
          ports:
            - containerPort: 51904
          volumeMounts:
            - name: config
              mountPath: /etc/routr/connect.yaml
              subPath: connect.yaml
            {{- include ".helm.apiKeyVolumeMount" . | nindent 12 }}
            {{- include ".helm.apiserverCAVolumeMount" . | nindent 12 }}
          resources:
            {{- if .Values.connect.resources.limits }}
            limits:
            {{- .Values.connect.resources.limits | toYaml | nindent 14 }}
            {{- end }}
            {{- if .Values.connect.resources.requests }}
            requests:
            {{- .Values.connect.resources.requests | toYaml | nindent 14 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.connect.securityContext.allowPrivilegeEscalation }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-routr-connect-config
        {{- include ".helm.apiKeyVolume" . | nindent 8 }}
        {{- include ".helm.apiserverCAVolume" . | nindent 8 }}
