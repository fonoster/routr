apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-location-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  location.yaml: |-
    kind: Location
    apiVersion: v2beta1
    logLevel: {{ include ".helm.logLevel" . }}
    {{- include ".helm.telemetry" . | nindent 4 }}
    metadata:
      region: {{ .Values.global.region }}
    spec:
      bindAddr: 0.0.0.0:51902
      cache:
      {{- if eq .Values.location.cache.provider "redis" }}
        provider: redis
        parameters: {{ include ".helm.redisParameters" (dict "ctx" . "component" "location" "parameters" .Values.location.cache.parameters) | quote }}
      {{- else }}
        provider: memory
      {{- end }}
