apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-dispatcher-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  dispatcher.yaml: |-
    kind: MessageDispatcher
    apiVersion: v2beta1
    ref: message-dispatcher
    spec:
      bindAddr: 0.0.0.0:51901
      {{- if .Values.dispatcher.recording.enabled }}
      recording:
        enabled: true
        path: {{ .Values.dispatcher.recording.path }}
        mode: {{ .Values.dispatcher.recording.mode }}
        redact: {{ .Values.dispatcher.recording.redact | default true }}
        {{- if .Values.dispatcher.recording.lint.profiles }}
        lint:
          profiles:
          {{- range .Values.dispatcher.recording.lint.profiles }}
            - {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      processors:
        {{- range .Values.dispatcher.processors }}
        - ref: {{ .ref }}
          addr: {{ .servicePrefix | default $.Release.Name }}-{{ .serviceName }}.{{ .serviceNamespace | default $.Release.Namespace }}:51904
          matchFunc: {{ .matchFunc | quote }}
          methods:
          {{- range .methods }}
            - {{ . }}
          {{- end }}
        {{- end }}
      {{- if .Values.dispatcher.middlewares }}
      middlewares:
        {{- range .Values.dispatcher.middlewares }}
        - ref: {{ .ref }}
          addr: {{ .servicePrefix | default $.Release.Name }}-{{ .serviceName }}.{{ .serviceNamespace | default $.Release.Namespace }}:51903
          postProcessor: {{ .postProcessor }}
        {{- end }}
      {{- end }}
