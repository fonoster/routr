{{- if .Values.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routr-registry-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include ".helm.labels" . | nindent 4 }}
data:
  registry.yaml: |-
    kind: Registry
    apiVersion: v3
    logLevel: {{ include ".helm.logLevel" . }}
    {{- include ".helm.telemetry" . | nindent 4 }}
    spec:
      # The headless Services: every pod, round robin
      requesterAddr: {{ include ".helm.headlessAddr" (dict "ctx" . "component" "requester" "port" 51909) }}
      requesterAuth:
        apiKey: {{ include ".helm.apiKeyRef" . }}
        # The Requester serves no TLS: the key crosses the cluster network in clear
        insecure: true
      apiAddr: {{ include ".helm.headlessAddr" (dict "ctx" . "component" "apiserver" "port" 51907) }}
      {{- include ".helm.apiAuth" . | nindent 6 }}
      registerInterval: {{ .Values.registry.registerInterval }}
      cache:
      {{- if eq .Values.registry.cache.provider "redis" }}
        provider: redis
        parameters: {{ include ".helm.redisParameters" (dict "ctx" . "component" "registry" "parameters" .Values.registry.cache.parameters) | quote }}
      {{- else }}
        provider: memory
      {{- end }}
      {{- if .Values.registry.methods }}
      methods: 
      {{- range .Values.registry.methods }}
        - {{.}}
      {{- end }}
      {{- end }}
      edgePorts:
        # The in-cluster EdgePort Service (see edgeport/service.yaml), on the UDP port
        - address: {{ .Release.Name }}-routr-edgeport.{{ .Release.Namespace }}:{{ .Values.edgeport.transport.udp.port | default 5060 }}
{{- end }}
