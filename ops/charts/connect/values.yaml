# RTPRelay Service defaults
rtprelay:
  enabled: false
  # RTPEngine host
  rtpeHost: ""
  # RTPEngine port
  rtpePort: 22222
  # RTPEngine profiles by direction, merged over the defaults one key at a time
  # (a list replaces the default list). Leave empty to run with the defaults.
  # Profile names: web-to-web, web-to-phone, phone-to-web, phone-to-phone,
  # web-to-secure-phone, phone-to-secure-phone. For example:
  #   profiles:
  #     phone-to-secure-phone:
  #       SDES: [only-AES_CM_128_HMAC_SHA1_80]
  profiles: {}
  # RTPRelay image configuration
  image:
    # RTPRelay image repository
    repository: fonoster/routr-rtprelay
    # RTPRelay image tag (immutable tags are recommended)
    # Uncomment to overwrite Chart.appVersion
    # tag: latest
    # RTPRelay image pull policy default to IfNotPresent
    pullPolicy: IfNotPresent
  # Pod annotations
  podAnnotations: {}
  # Service annotations
  serviceAnnotations: {}
  # Security context for RTPRelay
  securityContext:
    # Running as a non-root user
    runAsUser: 1000
    # Running as a non-root group
    runAsGroup: 3000
    # File system group
    fsGroup: 2000
    # By default, no privilege escalation is allowed
    allowPrivilegeEscalation: false
  # Liveness probe configuration
  livenessProbe:
    # Initial delay in seconds before starting the liveness probe
    initialDelaySeconds: 5
    # Period between liveness probes
    periodSeconds: 5
    # Number of successes required to be considered healthy
    successThreshold: 1
    # Number of failures required to be considered unhealthy
    failureThreshold: 2
    # Timeout in seconds for liveness probe
    timeoutSeconds: 4
  # Resource limits and requests
  resources:
    # Resource limits
    limits: {}
    # Resource requests
    requests: {}
  # Pods of the Deployment, when autoscaling.enabled is false
  replicas: 1
  # Autoscaling configuration: a HorizontalPodAutoscaler instead of replicas, on the CPU and
  # memory requests (needs metrics-server)
  autoscaling:
    # Off by default; on, it owns the replica count
    enabled: false
    # Minimum number of replicas
    minReplicas: 1
    # Maximum number of replicas
    maxReplicas: 10
    # Target CPU utilization percentage
    targetCPUUtilizationPercentage: 50
    # Target memory utilization percentage
    targetMemoryUtilizationPercentage: 70

# Postgresql Service defaults
postgresql:
  # Whether to enable PostgreSQL
  enabled: true
  # Bitnami sunset docker.io/bitnami, and its versioned tags now live under
  # bitnamilegacy. This is a stopgap until the move off Bitnami (#347).
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      # bitnami-shell has no bitnamilegacy copy; os-shell is its renamed successor
      repository: bitnamilegacy/os-shell
      tag: 11-debian-11-r99
  metrics:
    image:
      repository: bitnamilegacy/postgres-exporter
  auth:
    # The database the chart's own URL names. The Data API needs it to exist when it
    # starts, before the migrations run.
    database: routr
    # Initial username for the database
    username: routr
    # Initial password for the database
    password: changeme

# Redis Service defaults
redis:
  # Whether to enable Redis
  enabled: true
  architecture: standalone
  # Bitnami sunset docker.io/bitnami, and its versioned tags now live under
  # bitnamilegacy. This is a stopgap until the move off Bitnami (#347).
  image:
    repository: bitnamilegacy/redis
  sentinel:
    image:
      repository: bitnamilegacy/redis-sentinel
  metrics:
    image:
      repository: bitnamilegacy/redis-exporter
  volumePermissions:
    image:
      # bitnami-shell has no bitnamilegacy copy; os-shell is its renamed successor
      repository: bitnamilegacy/os-shell
      tag: 11-debian-11-r99
  sysctl:
    image:
      # bitnami-shell has no bitnamilegacy copy; os-shell is its renamed successor
      repository: bitnamilegacy/os-shell
      tag: 11-debian-11-r99
  auth:
    enabled: false
