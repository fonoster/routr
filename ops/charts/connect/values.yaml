# APIServer Service defaults
apiserver:
  # Extra environment variables for the container, like GOMAXPROCS
  env: []
  # Uncomment the next line if you want to point to an external postgresql db
  # databaseUrl: postgresql://routr:changeme@dbserver:5432/routr
  # Serves the Data API over TLS, on 51907 and on the Service's external port 51908. Set it to
  # false only if something else encrypts the traffic (not recommended): its callers' API key
  # then crosses the cluster network in clear. The certificate comes from tlsSecret or, when
  # that is empty, from a CA the chart generates once and keeps in <release>-routr-apiserver-tls.
  tlsOn: true
  # When true, a client certificate signed by the Secret's ca.crt authenticates a caller, and
  # one it did not sign fails the handshake. The API key keeps working, which is what Connect
  # and the Registry use. Requires tlsOn.
  verifyClientCert: false
  # An existing Secret with tls.crt, tls.key and ca.crt, instead of the generated one. The
  # certificate has to name <release>-routr-apiserver.<namespace>, what Connect and the
  # Registry dial.
  tlsSecret: ""
  # The API key of the Data API and the Requester. Empty generates one, once, and keeps it in
  # <release>-routr-api-key (key: apiKey). Set it when something renders the chart without
  # access to the cluster, such as a GitOps controller: the generated one would change.
  apiKey: ""
  # Uncomment the next line if you want to enable field level encryption
  # Create a new encryption key with cloack (https://cloack.47ng.com)
  # cloakEncryptionKey: k1.aesgcm256...
  # APIServer image configuration
  image:
    # APIServer image repository
    repository: fonoster/routr-pgdata
    # APIServer image tag (immutable tags are recommended)
    # Uncomment to overwrite Chart.appVersion
    # tag: latest
    # APIServer image pull policy default to IfNotPresent
    pullPolicy: IfNotPresent
  migrations:
    enabled: true
    image:
      # APIServer migrations image repository
      repository: fonoster/routr-pgdata-migrations
      # Routr 2's image: Routr 3 keeps the schema and ships no migrations, so this tag
      # doesn't follow Chart.appVersion
      tag: "2.32.2"
      # APIServer image pull policy default to IfNotPresent
      pullPolicy: IfNotPresent
    resources:
      # Resource limits
      limits: {}
      # Resource requests
      requests: {}
  # Pod annotations
  podAnnotations: {}
  # Service annotations
  serviceAnnotations: {}
  # Security context for APIServer    
  securityContext:
    # Running as a non-root user
    runAsUser: 1000
    # Running as a non-root group
    runAsGroup: 3000
    # File system group
    fsGroup: 2000
    # By default, no privilege escalation is allowed
    allowPrivilegeEscalation: false
  # Liveness probe configuration
  livenessProbe:
    # Initial delay in seconds before starting the liveness probe
    initialDelaySeconds: 5
    # Period between liveness probes
    periodSeconds: 5
    # Number of successes required to be considered healthy
    successThreshold: 1
    # Number of failures required to be considered unhealthy
    failureThreshold: 2
    # Timeout in seconds for liveness probe
    timeoutSeconds: 4
  # Resource limits and requests
  resources:
    # Resource limits
    limits: {}
    # Resource requests
    requests: {}
  # Autoscaling configuration  
  autoscaling:
    # Minimum number of replicas
    minReplicas: 1
    # Maximum number of replicas
    maxReplicas: 10
    # Target CPU utilization percentage
    targetCPUUtilizationPercentage: 50
    # Target memory utilization percentage
    targetMemoryUtilizationPercentage: 70

# Connect Service defaults
connect:
  # Extra environment variables for the container, like GOMAXPROCS
  env: []
  # How long a digest nonce stays valid, in seconds; 0 accepts any nonce
  nonceMaxAge: 300
  # The expiry granted to a REGISTER that names none, in seconds
  registerDefaultExpires: 3600
  # The Verifier service that checks Connect Tokens; unset accepts none
  # verifierAddr: verifier:51905
  # The platform headers removed from untrusted requests. Unset is the default list;
  # an empty list strips nothing
  # untrustedHeadersToStrip: []
  # Narrows which X-Edgeport-Ref values are honored; empty is any, from a trusted address
  trustedEdgePorts: []
  # The peer EdgePorts, as IPs or CIDRs, whose forwarded requests skip routing; empty
  # trusts none
  trustedEdgePortAddresses: []
  # Where a Trunk's REGISTER may come from, as IPs, CIDRs or DNS names. The default is
  # the Requester's headless Service, which resolves to exactly its pods; Connect keeps
  # the name resolved in the background. The entries are templates, so a name can carry
  # the release. The chart refuses an empty list while registry.enabled is true. See
  # "Trunk registration" in the README.
  trustedRegistryAddresses:
    - "{{ .Release.Name }}-routr-requester-headless.{{ .Release.Namespace }}"
  # Connect image configuration
  image:
    # Connect image repository
    repository: fonoster/routr-connect
    # Connect image tag (immutable tags are recommended)
    # Uncomment to overwrite Chart.appVersion
    # tag: latest
    # Connect image pull policy default to IfNotPresent
    pullPolicy: IfNotPresent
  # Pod annotations
  podAnnotations: {}
  # Service annotations
  serviceAnnotations: {}
  # Security context for Connect    
  securityContext:
    # Running as non-root user
    runAsUser: 1000
    # Running as non-root group
    runAsGroup: 3000
    # File system group
    fsGroup: 2000
    # By default, no privilege escalation is allowed
    allowPrivilegeEscalation: false
  # Liveness probe configuration
  livenessProbe:
    # Initial delay in seconds before starting the liveness probe
    initialDelaySeconds: 5
    # Period between liveness probes
    periodSeconds: 5
    # Number of successes required to be considered healthy
    successThreshold: 1
    # Number of failures required to be considered unhealthy
    failureThreshold: 2
    # Timeout in seconds for liveness probe
    timeoutSeconds: 1
  # Resource limits and requests
  resources:
    # Resource limits
    limits: {}
    # Resource requests
    requests: {}
  # Autoscaling configuration
  autoscaling:
    # Minimum number of replicas
    minReplicas: 1
    # Maximum number of replicas
    maxReplicas: 10
    # Target CPU utilization percentage
    targetCPUUtilizationPercentage: 50
    # Target memory utilization percentage
    targetMemoryUtilizationPercentage: 70

# Registry Service defaults
registry:
  # Deploys the Registry and the Requester it sends through, for the Trunks that ask for
  # a periodic REGISTER
  enabled: true
  # Seconds between rounds of REGISTER
  registerInterval: 20
  # Cache configuration
  cache:
    # Cache provider. Default to memory
    provider: redis
    # Cache parameters. Default to empty string
    parameters: ""
  # Registry image configuration
  methods:
    - INVITE
    - MESSAGE
  # Registry image configuration
  image:
    # Registry image repository
    repository: fonoster/routr-registry
    # Registry image tag (immutable tags are recommended)
    # Uncomment to overwrite Chart.appVersion
