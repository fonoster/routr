services:
  # Main EdgePort server
  edgeport01:
    image: fonoster/routr-edgeport
    ports:
      - 5060:5060
      - 5060:5060/udp
      - 5061:5061
      - 5062:5062
      - 5063:5063
    volumes:
      - ./config/edgeport.yaml:/etc/routr/edgeport.yaml

  # Secondary EdgePort server
  edgeport02:
    image: fonoster/routr-edgeport
    ports:
      - 6060:6060
      - 6060:6060/udp
      - 6061:6061
      - 6062:6062
      - 6063:6063
    volumes:
      - ./config/edgeport.alt.yaml:/etc/routr/edgeport.yaml

  # Takes care of routing traffic from the EdgePort servers
  dispatcher:
    image: fonoster/routr-dispatcher
    expose:
      - 51901
    volumes:
      - ./config/dispatcher.yaml:/etc/routr/dispatcher.yaml

  # Store the location to all SIP endpoints in the network
  location:
    image: fonoster/routr-location
    expose:
      - 51902
    volumes:
      - ./config/location.yaml:/etc/routr/location.yaml

  # Connect processor
  connect:
    image: fonoster/routr-connect
    expose:
      - 51904
    # This stack has no static addresses, so trustedRegistryAddresses is empty and a Trunk's
    # REGISTER is challenged like an endpoint's. For Trunks that register, set it to this
    # stack's network (docker network inspect) and sipHost in config/requester.yaml.
    volumes:
      - ./config/connect.yaml:/etc/routr/connect.yaml

  # The Data API over the files backend (config/data.yaml)
  apiserver:
    image: fonoster/routr-pgdata
    expose:
      - 51907
    volumes:
      - ./config/data.yaml:/etc/routr/data.yaml
      - ./config/resources:/etc/routr/resources

  # Takes gRPC requests and sends them to an EdgePort
  requester:
    image: fonoster/routr-requester
    expose:
      - 51909
    volumes:
      - ./config/requester.yaml:/etc/routr/requester.yaml

  # Sends registration request on behalf of trunks
  registry:
    image: fonoster/routr-registry
    volumes:
      - ./config/registry.yaml:/etc/routr/registry.yaml
