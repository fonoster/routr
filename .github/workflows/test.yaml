name: Tests

# Runs the suites that gate a change. Until this workflow existed nothing ran on a pull
# request, and the only enforcement was the (bypassable) .husky/pre-commit hook.
#
# Deliberately NOT gated here:
#   - the @routr/ctl suite      -> its one test fails on oclif command discovery when run
#                                  from the monorepo root ("command acl:get not found"),
#                                  and the root glob below never matched it anyway
#   - npm run test:integration  -> needs a live Redis
#   - npm run test:graaljs      -> needs a GraalVM JAVA_HOME plus the jars from npm run setup
#
# The SEET compliance suite (SIP Connect v1.1) runs in the `compliance` job below. It
# stands up the full compose stack and drives it with SIPp, so it is the slow job.
# Caveat: the Node service images (mods/*/Dockerfile) `npm pack` the module and
# `npm install -g` the tarball, which pulls @routr/common, @routr/processor and
# @routr/location from the npm registry, not from this checkout. A change to one of
# those packages reaches this job only through the edgeport/requester webpack bundle.

# Runs once per change, on its pull request. Branch protection requires these checks and
# requires the branch to be up to date with main, so what merges is what passed, and main
# is not tested again. A PR that only touches docs, the site, designs or Markdown skips
# the suites; its skipped jobs still satisfy the required checks.
on:
  pull_request:
  # Re-run a branch by hand: gh workflow run test.yaml --ref <branch>
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Look for changes outside docs, site, designs and Markdown
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
          code=$(echo "$files" | grep -Ev '^(docs|docs-site|site|designs)/|\.md$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, site, designs or Markdown changed; skipping the suites"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests, typecheck and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # npm ci, not npm install: the tree must match package-lock.json exactly. An
      # npm install here silently drifts @oclif/core past the pinned 1.26.2, which
      # breaks the @routr/ctl build with ~119 type errors.
      - name: Install dependencies
        run: npm ci

      # The workspaces resolve to dist/ (@routr/common's main is dist/index) and there
      # are no tsconfig path mappings back to src, so the suite needs a build first.
      - name: Generate Prisma client
        run: npm run generate --workspace=@routr/pgdata

      - name: Build workspaces
        run: npx lerna run build

      - name: Unit tests
        run: npm test

      # EdgePort runs this bundle in GraalJS without BigInt; a dependency that uses it breaks startup
      - name: Check the EdgePort bundle for GraalJS
        run: npm run transpile && npx webpack --config webpack.config.js --mode none && npm run check:bundle

      - name: Typecheck
        run: npm run typecheck

      # The lint script carries --fix, which mutates the tree; CI must only report.
      - name: Lint
        run: npx eslint mods --ext .ts

  compat:
    name: Known-good corpus compatibility
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Node services
        run: npm run generate --workspace=@routr/pgdata && npx lerna run build

      # Replays every recording of etc/corpus through simpledata, location,
      # connect and the dispatcher started from this checkout (no EdgePort, no
      # Docker) and fails on drift or on a rule finding the corpus did not have.
      - name: Replay the corpus through the chain
        run: npm run compat -- --sip-connect

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-logs
          path: /tmp/routr-compat-*.log

  java:
    name: EdgePort and Requester tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to 17 on purpose: Mockito 5.1.1 cannot read Java 21 class files, and on a
      # 21 JDK 20 of the 55 tests fail with ByteBuddy IllegalArgumentException rather
      # than any real assertion failure.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Java tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report
          path: mods/*/build/reports/tests/test

  compliance:
    name: SIP Connect v1.1 compliance (SEET)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # npm run make + compose build + settle + the suite is about 20 min on a normal runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # npm run setup runs gradle, which needs a JDK. Pinned to 17 like the java job.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The edgeport/requester images copy mods/*/libs (gitignored; built by gradle and
      # webpack) and the Node images npm pack dist/, so the whole project is built first.
      - name: Build project
        run: npm run make

      # The EdgePort and the SEET fake carrier share one certificate, so a call over TLS
      # to the carrier is trusted (compose.dev.yaml mounts etc/certs into both).
      - name: Generate dev certificates
        run: sh .scripts/dev-certs.sh

      # Build every image from this checkout, let
      # edgeport's JVM and the data services settle, then run the compliance container
      # on its own and take its exit code.
      - name: Bring up the stack
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up --build -d
          sleep 60
          docker compose -f compose.yaml -f compose.dev.yaml ps

      - name: Run the compliance suite
        run: >
          docker compose -f compose.yaml -f compose.dev.yaml up
          --abort-on-container-exit --exit-code-from compliance compliance

      # SEET only prints "UAS failed. See logs for more details". The SIPp traces it
      # means are written to / in the compliance container, which has exited but is
      # not removed.
      - name: Collect SIPp traces
        if: failure()
        run: |
          mkdir -p compliance-traces
          cid=$(docker compose -f compose.yaml -f compose.dev.yaml ps -aq compliance)
          docker export -o compliance-traces/fs.tar "$cid"
          tar -tf compliance-traces/fs.tar | grep -E '^(\./)?[^/]+_(errors|messages)\.log$' \
            | xargs tar -xf compliance-traces/fs.tar -C compliance-traces || true
          rm -f compliance-traces/fs.tar
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail 400 \
            > compliance-traces/compose-services.log 2>&1 || true
          ls -l compliance-traces

      - name: Upload compliance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-traces
          path: compliance-traces
          if-no-files-found: warn

      # The dispatcher records every call of the run as one .jsonl per call
      # (RECORD_MESSAGES in compose.dev.yaml). Replay one locally with
      # `rctl trace replay <file>`; compare two runs with --compare.
      - name: Collect call recordings
        if: always()
        run: |
          mkdir -p call-recordings
          docker compose -f compose.yaml -f compose.dev.yaml cp dispatcher:/var/routr/traces/. call-recordings/ || true
          ls call-recordings | wc -l

      - name: Upload call recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-recordings
          path: call-recordings
          if-no-files-found: warn

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v
