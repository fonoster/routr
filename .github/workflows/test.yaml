name: Tests

# Runs the suites that gate a change. Until this workflow existed nothing ran on a pull
# request, and the only enforcement was the (bypassable) .husky/pre-commit hook.
#
# Deliberately NOT gated here:
#   - the @routr/ctl suite      -> its one test fails on oclif command discovery when run
#                                  from the monorepo root ("command acl:get not found"),
#                                  and the root glob below never matched it anyway
#   - npm run test:integration  -> needs a live Redis
#
# The SEET compliance suite (SIP Connect v1.1) runs in the `compliance` job below. It
# stands up the full compose stack and drives it with SIPp, so it is the slow job.
# Caveat: the Node service images (mods/*/Dockerfile) `npm pack` the module and
# `npm install -g` the tarball, which pulls @routr/common, @routr/processor and
# @routr/location from the npm registry, not from this checkout. A change to one of
# those packages reaches this job only through the Go EdgePort's wire contract.

# Runs once per change, on its pull request. Branch protection requires these checks and
# requires the branch to be up to date with main, so what merges is what passed, and main
# is not tested again. A PR that only touches docs, the site, designs or Markdown skips
# the suites; its skipped jobs still satisfy the required checks.
on:
  pull_request:
  # Re-run a branch by hand: gh workflow run test.yaml --ref <branch>
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Look for changes outside docs, site, designs and Markdown
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
          # The Go job is for changes to the Go module, the protos and this workflow
          if echo "$files" | grep -Eq '^(go\.mod|go\.sum|cmd/|internal/|protos/|scripts/protoc\.sh|\.github/workflows/test\.yaml$)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          code=$(echo "$files" | grep -Ev '^(docs|docs-site|site|designs)/|\.md$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, site, designs or Markdown changed; skipping the suites"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests, typecheck and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # npm ci, not npm install: the tree must match package-lock.json exactly. An
      # npm install here silently drifts @oclif/core past the pinned 1.26.2, which
      # breaks the @routr/ctl build with ~119 type errors.
      - name: Install dependencies
        run: npm ci

      # The workspaces resolve to dist/ (@routr/common's main is dist/index) and there
      # are no tsconfig path mappings back to src, so the suite needs a build first.
      - name: Build workspaces
        run: npx lerna run build

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The lint script carries --fix, which mutates the tree; CI must only report.
      - name: Lint
        run: npx eslint mods --ext .ts

  compat:
    name: Known-good corpus compatibility
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Node services
        run: npx lerna run build

      # Replays every recording of etc/corpus and interop/*/manifest.yaml through
      # simpledata, location, connect and the dispatcher started from this checkout (no EdgePort, no
      # Docker) and fails on drift or on a rule finding the corpus did not have.
      - name: Replay the corpus through the chain
        run: npm run compat -- --sip-connect

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-logs
          path: /tmp/routr-compat-*.log

  compliance:
    name: SIP Connect v1.1 compliance (SEET)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # npm ci + build + compose build + settle + the suite is about 20 min on a normal runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # The Node images still in the stack (registry, rtprelay) npm pack dist/, so the
      # TypeScript packages are built first; the Go images (cmd/*/Dockerfile) build their
      # binaries themselves from the repository root.
      - name: Build project
        run: npm ci && npm run build

      # The EdgePort and the SEET fake carrier share one certificate, so a call over TLS
      # to the carrier is trusted (compose.dev.yaml mounts etc/certs into both).
      - name: Generate dev certificates
        run: sh .scripts/dev-certs.sh

      # Build every image from this checkout, let the EdgePorts and the data services
      # settle, then run the compliance container
      # on its own and take its exit code.
      - name: Bring up the stack
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up --build -d
          sleep 60
          docker compose -f compose.yaml -f compose.dev.yaml ps

      - name: Run the compliance suite
        run: >
          docker compose -f compose.yaml -f compose.dev.yaml up
          --abort-on-container-exit --exit-code-from compliance compliance

      # SEET only prints "UAS failed. See logs for more details". The SIPp traces it
      # means are written to / in the compliance container, which has exited but is
      # not removed.
      - name: Collect SIPp traces
        if: failure()
        run: |
          mkdir -p compliance-traces
          cid=$(docker compose -f compose.yaml -f compose.dev.yaml ps -aq compliance)
          docker export -o compliance-traces/fs.tar "$cid"
          tar -tf compliance-traces/fs.tar | grep -E '^(\./)?[^/]+_(errors|messages)\.log$' \
            | xargs tar -xf compliance-traces/fs.tar -C compliance-traces || true
          rm -f compliance-traces/fs.tar
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail 400 \
            > compliance-traces/compose-services.log 2>&1 || true
          ls -l compliance-traces

      - name: Upload compliance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-traces
          path: compliance-traces
          if-no-files-found: warn

      # The Node dispatcher recorded every call of the run as one .jsonl per call
      # (spec.recording in config/dispatcher.dev.yaml); the Go dispatcher does not
      # until milestone 3 (ROUTR3.md § 6), so the artifact is empty for now. Replay one
      # locally with `rctl trace replay <file>`; compare two runs with --compare.
      - name: Collect call recordings
        if: always()
        run: |
          mkdir -p call-recordings
          docker compose -f compose.yaml -f compose.dev.yaml cp dispatcher:/var/routr/traces/. call-recordings/ || true
          ls call-recordings | wc -l

      - name: Upload call recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-recordings
          path: call-recordings
          if-no-files-found: warn

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v

  # The Go module (cmd/, internal/): gofmt, vet and the race tests. SEET runs on the Go
  # EdgePort in the compliance job above. The postgres service is for the Data API's
  # real-database test (internal/data TestPostgresAgainstADatabase): it runs against the
  # Routr 2 schema, so Routr 2's migrations (mods/pgdata on main) are applied first.
  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routr
          POSTGRES_PASSWORD: routr
          POSTGRES_DB: routr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routr -d routr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://routr:routr@localhost:5432/routr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The migrations live on main only (v3 carries no mods/pgdata): fetch them from
      # there and apply each migration.sql in order, as prisma migrate deploy would.
      - name: Apply Routr 2's migrations
        run: |
          git fetch --depth=1 origin main
          dir=$(mktemp -d)
          for m in $(git ls-tree -r --name-only FETCH_HEAD mods/pgdata/migrations | grep '/migration\.sql$' | sort); do
            git show "FETCH_HEAD:$m" > "$dir/$(basename "$(dirname "$m")").sql"
          done
          for f in $(ls "$dir"/*.sql | sort); do
            echo "applying $(basename "$f")"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Format, vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -race ./...
