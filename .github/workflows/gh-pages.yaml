name: Publish Website

# routr.io on GitHub Pages: the website from site/, plus redirect stubs for the old /docs URLs,
# which now live on docs.routr.io (see docs-site/REDIRECTS.md). The frozen 2.0.0 and 1.x.x docs,
# their Docusaurus assets and the Helm charts are already on gh-pages and are never rebuilt:
# keep_files leaves every file this run doesn't write in place.

on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'
      - '.scripts/docs-redirect*'
      - '.github/workflows/gh-pages.yaml'
    branches:
      - main

jobs:
  build_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.x"
    - name: Populate out directory
      run: |
        node .scripts/docs-redirect-stubs.js out https://docs.routr.io

        # Website (site/README.md stays out). The frozen docs keep their assets under
        # assets/ with hashed file names, so the site's assets/css, assets/js and assets/img
        # merge in safely.
        mkdir -p out/assets
        cp -a site/assets/* out/assets/
        cp site/index.html site/404.html out/
        mkdir -p out/record-and-replay
        cp site/record-and-replay/index.html out/record-and-replay/
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.DEPLOY_KEY }}
        publish_dir: ./out
        publish_branch: gh-pages
        keep_files: true
        cname: routr.io
