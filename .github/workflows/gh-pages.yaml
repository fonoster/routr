name: publish to gh pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - 'site/**'
      - '.scripts/docs-redirect*'
    branches:
      - main

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout routr repo
      uses: actions/checkout@v4
      with:
        repository: fonoster/routr
        path: routr
        ref: gh-pages
    - name: Save charts directory
      run: |
        mkdir -p /tmp/charts
        cp -a routr/charts/* /tmp/charts
    - name: Checkout current repo
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
    - name: Build and populate out directory
      run: |
        # Create out directories
        mkdir -p out/charts

        # Build docs
        cd docs
        npm install
        npm run build
        cp -a build/* ../out/
        cd ..

        # Charts directory
        cp -a /tmp/charts/* out/charts

        # Docs moved to docs.routr.io (Mintlify). Once that host answers, replace the old
        # 2.11.5 pages with redirect stubs; 2.0.0 and 1.x.x stay frozen. See docs-site/REDIRECTS.md.
        if curl -sfIL --max-time 10 https://docs.routr.io/introduction > /dev/null; then
          node .scripts/docs-redirect-stubs.js out https://docs.routr.io
        else
          echo "docs.routr.io not live yet; keeping the Docusaurus 2.11.5 pages"
        fi

        # Website (site/README.md stays out; the docs build owns robots.txt and sitemap.xml). The docs build also writes out/assets with
        # hashed file names, so the site's assets/css, assets/js and assets/img merge in safely.
        mkdir -p out/assets
        cp -a site/assets/* out/assets/
        cp site/index.html site/404.html out/
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.DEPLOY_KEY }}
        publish_dir: ./out
        publish_branch: gh-pages
        cname: routr.io
