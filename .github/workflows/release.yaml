name: Release

# Every push to main is released; Tests already passed on its pull request (see test.yaml).
# The conventional commits since the last tag pick the bump (.scripts/next-release.sh), and
# a push with nothing releasable (docs, chore, ci, test) ships nothing. One release
# publishes, in order, the npm packages, the Docker images, the Helm chart (only once its
# images exist) and the GitHub release with its shareable card (.scripts/release-card).
#
# Run it by hand to retry a release that failed partway; with no new commits it re-publishes
# the current version from its tag, skipping whatever is already out:
#   gh workflow run release.yaml
#
# npm trusts only this file to publish the @routr packages (trusted publishing), so keep its name.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases run one at a time; a second one would race the first for the tag. Each checks out
# the tip of main, so a run that waited still releases everything merged before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token lets npm verify this run (trusted publishing), so no npm token is stored
    permissions:
      contents: write
      id-token: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The PAT pushes the release commit and tag past branch protection.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Plan the release
        id: plan
        run: |
          bump=$(.scripts/next-release.sh)
          if [ "$bump" != "none" ]; then
            echo "Releasing a $bump"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version=$(node -p "require('./lerna.json').version")
            echo "Nothing new to release; re-publishing v$version"
            git checkout "v$version"
          else
            echo "No releasable commits since the last tag"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@routr"

      - name: Install an npm with trusted publishing
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@^11.10.0

      - name: Build
        if: steps.plan.outputs.publish == 'true'
        run: npm run make

      # Bumps every package, points the Helm chart at the new version and adds its entry to
      # docs-site/changelog.mdx (the root "version" script), commits all of it as one [skip ci]
      # commit, tags it and pushes. It publishes nothing; the next step does.
      - name: Version
        if: steps.plan.outputs.bump != 'none' && steps.plan.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout package-lock.json
          npm run release

      # The only publish: any version in package.json that npm doesn't have yet, the one
      # just tagged or one whose release run failed partway. Sigstore can reject a
      # package's provenance upload with a 409 (TLOG_CREATE_ENTRY_ERROR) that a later
      # attempt gets past, so it retries. A failed attempt leaves gitHead edits in
      # package.json files and from-package refuses a dirty tree, so each attempt resets it.
      - name: Publish versions missing from npm
        if: steps.plan.outputs.publish == 'true'
        run: .scripts/retry.sh 5 60 sh -c "git checkout -- . && npx lerna publish from-package --yes --dist-tag latest"

      - name: Read the version
        id: version
        if: steps.plan.outputs.publish == 'true'
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the build
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: routr-build
          include-hidden-files: true
          path: |
            mods
            .scripts
            config
            lerna.json
            Dockerfile
            etc/edgeport.yaml
            !mods/**/node_modules
            !mods/**/src
            !mods/**/test
            !mods/**/dist/*.ts

  docker:
    name: Publish ${{ matrix.image }} to Docker Hub
    needs: npm
    if: needs.npm.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: routr-one
            dockerfile: Dockerfile
          - image: routr-edgeport
            dockerfile: mods/edgeport/Dockerfile
          - image: routr-dispatcher
            dockerfile: mods/dispatcher/Dockerfile
          - image: routr-location
            dockerfile: mods/location/Dockerfile
          - image: routr-connect
            dockerfile: mods/connect/Dockerfile
          - image: routr-simpledata
            dockerfile: mods/simpledata/Dockerfile
          - image: routr-simpleauth
            dockerfile: mods/simpleauth/Dockerfile
          - image: routr-requester
            dockerfile: mods/requester/Dockerfile
          - image: routr-registry
            dockerfile: mods/registry/Dockerfile
          - image: routr-pgdata
            dockerfile: mods/pgdata/Dockerfile
            buildoptions: "--target runner"
          - image: routr-pgdata-migrations
            dockerfile: mods/pgdata/Dockerfile
            buildoptions: "--target migrations"
          - image: routr-echo
            dockerfile: mods/echo/Dockerfile
          - image: routr-rtprelay
            dockerfile: mods/rtprelay/Dockerfile
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: routr-build

      # routr-one installs the @routr packages from npm, which can take a few minutes to serve
      # a version it just accepted (npm error notarget). Waits for every one it installs.
      - name: Wait for the npm packages
        if: matrix.image == 'routr-one'
        env:
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          pkgs=$(node -e '
            const manifest = name => require("./mods/" + name.slice("@routr/".length) + "/package.json")
            const seen = new Set()
            const todo = ["@routr/one"]
            while (todo.length) {
              for (const dep of Object.keys(manifest(todo.pop()).dependencies || {})) {
                if (dep.startsWith("@routr/") && !seen.has(dep)) { seen.add(dep); todo.push(dep) }
              }
            }
            console.log([...seen].sort().join(" "))')
          deadline=$((SECONDS + 300))
          for pkg in $pkgs; do
            until [ "$(npm view "$pkg@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$pkg@$VERSION is still not on npm after 5 minutes"
                exit 1
              fi
              echo "Waiting for $pkg@$VERSION"
              sleep 15
            done
            echo "$pkg@$VERSION is available"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish the image
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: fonoster/${{ matrix.image }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          dockerfile: ${{ matrix.dockerfile }}
          buildoptions: ${{ matrix.buildoptions }}
          tags: "latest,${{ needs.npm.outputs.version }}"
          platforms: linux/amd64,linux/arm64

  # The chart installs the image tag matching its appVersion, so it ships only after every
  # image is on Docker Hub, and only from the release tag.
  chart:
    name: Publish Helm Chart
    needs: [npm, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.npm.outputs.version }}

      - name: Checkout the published charts
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Helm
        uses: azure/setup-helm@v4.1.0
        with:
          version: latest

      - name: Package the chart
        run: |
          mkdir -p public/charts
          cp -a gh-pages/charts/* public/charts
          helm package ops/charts/connect -d public/charts
          helm repo index public/charts --merge public/charts/index.yaml

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true

  github:
    name: Create GitHub Release
    needs: [npm, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.npm.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Write the release notes
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_types: other,doc,chore
          config_file: ./.scripts/tag-changelog-config.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # A card that fails to render leaves the release without one rather than holding it up.
      - name: Render the release card
        continue-on-error: true
        run: |
          npm ci --prefix .scripts/release-card
          node .scripts/release-card/release-card.mjs "$TAG" "release-card-$TAG.png"

      - name: Publish the release
        env:
          NOTES: ${{ steps.changelog.outputs.changelog }}
        run: |
          card=()
          [ -f "release-card-$TAG.png" ] && card=("release-card-$TAG.png")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --latest --notes "$NOTES"
            if [ ${#card[@]} -gt 0 ]; then gh release upload "$TAG" "${card[@]}" --clobber; fi
          else
            gh release create "$TAG" "${card[@]}" --title "Release $TAG" --latest --notes "$NOTES"
          fi
