name: release

on:
  workflow_dispatch:
    inputs:
      with_tests:
        description: 'Run compliance tests'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
      use_branch_name:
        description: 'Use branch name instead of lerna version'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
      tag_latest:
        description: 'Only move the npm latest tag to the version on this branch'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
  # Publishing the draft GitHub release moves the npm `latest` tag. It lives in this workflow
  # because npm trusts only this file to publish and tag the @routr packages.
  release:
    types:
      - released

jobs:
  build-and-test:
    name: Build and run SIP Connect Compliance Tests
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag_latest != 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # id-token lets npm verify this run (trusted publishing), so no npm token is stored
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@routr"
      - name: Install an npm with trusted publishing
        run: npm install -g npm@^11.10.0
      - name: Build project
        run: npm run make
      - name: Check for next release
        run: |
          release=$(.scripts/next-release.sh)
          echo "Next release: $release"
          echo "RELEASE=$release" >> $GITHUB_ENV
      - name: Publish packages to NPM
        if: env.RELEASE != 'none'
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_PAT }}" >> $GITHUB_ENV

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout package-lock.json

          npm run release
      # Runs on every release, even with no new commits: publishes any version already in
      # package.json that npm doesn't have yet, such as one whose release run failed partway.
      # Does nothing otherwise.
      - name: Publish versions missing from NPM
        run: |
          # The normal publish leaves gitHead edits in package.json files; from-package refuses a
          # dirty tree, and those edits are not meant to be committed.
          git checkout -- .
          npx lerna publish from-package --yes --dist-tag next
      - name: Get version for release
        run: |
          if [[ "${{ github.event.inputs.use_branch_name }}" == "true" ]]; then
            echo "LERNA_VERSION=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          else
            lerna_version=$(node -p "require('./lerna.json').version")
            echo "LERNA_VERSION=$lerna_version" >> $GITHUB_ENV
          fi
      - name: Create release note
        if: env.RELEASE != 'none'
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.DEPLOY_KEY }}
          exclude_types: other,doc,chore
          config_file: ./.scripts/tag-changelog-config.js
      - name: Create draft release
        if: env.RELEASE != 'none'
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_KEY }}
        with:
          tag_name: v${{ env.LERNA_VERSION }}
          release_name: Release v${{ env.LERNA_VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: routr-build
          include-hidden-files: true
          path: |
            mods
            .scripts
            config
            lerna.json
            Dockerfile
            etc/edgeport.yaml
            !mods/**/node_modules
            !mods/**/src
            !mods/**/test
            !mods/**/dist/*.ts
      # This step is only executed for workflow_dispatch events with with_tests = true
      - name: SIP Connect v1.1 Compliance Tests
        if: github.event.inputs.with_tests == 'true'
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up --build -d && \
          sleep 60 && \
          docker compose -f compose.yaml -f compose.dev.yaml ps && \
          docker compose -f compose.yaml -f compose.dev.yaml up --abort-on-container-exit --exit-code-from compliance compliance
      # SEET only prints "UAS failed. See logs for more details". The SIPp traces it
      # means are written to / in the compliance container (the image has no WORKDIR
      # and `seet` does not cd), one <scenario>_<pid>_errors.log and _messages.log per
      # user agent. The container has exited but is not removed, so stream its
      # filesystem out and keep just those files, plus the services' logs.
      - name: Collect SIPp traces
        if: failure() && github.event.inputs.with_tests == 'true'
        run: |
          mkdir -p compliance-traces
          cid=$(docker compose -f compose.yaml -f compose.dev.yaml ps -aq compliance)
          docker export -o compliance-traces/fs.tar "$cid"
          tar -tf compliance-traces/fs.tar | grep -E '^(\./)?[^/]+_(errors|messages)\.log$' \
            | xargs tar -xf compliance-traces/fs.tar -C compliance-traces || true
          rm -f compliance-traces/fs.tar
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail 400 \
            > compliance-traces/compose-services.log 2>&1 || true
          ls -l compliance-traces
      - name: Upload compliance traces
        if: failure() && github.event.inputs.with_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compliance-traces
          path: compliance-traces
          if-no-files-found: warn
      - name: Cleanup services
        if: always() && github.event.inputs.with_tests == 'true'
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml down

  publish-to-docker-hub:
    name: Publish to Docker Hub
    uses: ./.github/workflows/docker-hub-release.yaml
    with:
      use_branch_name: ${{ github.event.inputs.use_branch_name }}
    secrets: inherit
    needs: [build-and-test]

  tag-latest:
    name: Tag the released npm packages as latest
    if: github.event_name == 'release' || github.event.inputs.tag_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@routr"
      - name: Install an npm with trusted publishing
        run: npm install -g npm@^11.10.0
      - name: Tag latest npm packages
        run: |
          for pkg in mods/*/package.json; do
            if [ "$(jq -r '.private // false' "$pkg")" = "true" ]; then continue; fi
            npm dist-tag add "$(jq -r '.name' "$pkg")@$(jq -r '.version' "$pkg")" latest
          done
