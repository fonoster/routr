- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-01
  metadata:
    name: Test Trunk
    region: us-east1
  spec:
    inbound:
      uri: trunk01.acme.com
      accessControlListRef: acl-01
    outbound:
      sendRegister: true
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 7060
            transport: udp
          priority: 10
          weight: 10
          enabled: true

- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-02
  metadata:
    name: Test Trunk2
    region: us-east1
  spec:
    # Calls leaving through this trunk carry +E.164 users and
    # present the Number as the caller (SC-IT.Conf.1.3.1)
    calledNumberFormat: e164
    callerNumberFormat: e164
    rewriteFromWithNumber: true
    inbound:
      uri: trunk02.acme.com
      accessControlListRef: acl-01
      credentialsRef: credentials-04
    outbound:
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 7060
            transport: udp
          priority: 10
          weight: 10
          enabled: true

- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-03
  metadata:
    name: Test Trunk3
    region: us-west1
  spec:
    inbound:
      uri: trunk03.acme.com
      credentialsRef: credentials-04
    outbound:
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 7060
            transport: udp
          priority: 10
          weight: 10
          enabled: true

# Reaches the Service Provider over TLS. The provider is the SEET fake carrier, which
# serves the certificate from etc/certs on 5061 (see .scripts/dev-certs.sh).
- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-04
  metadata:
    name: Test Trunk4 (TLS)
    region: us-east1
  spec:
    inbound:
      uri: trunk04.acme.com
      accessControlListRef: acl-01
    outbound:
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 5061
            transport: tls
          priority: 10
          weight: 10
          enabled: true

# Registers with the Service Provider over TLS (RR.Tst.Plan.1.2.4): the Registry's
# REGISTER reaches the EdgePort over UDP, and the EdgePort opens the TLS connection.
# On 5062, not 5061: the UASes of 1.2.2 and 1.2.3 listen there and expect an INVITE.
- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-05
  metadata:
    name: Test Trunk5 (TLS, registers)
    region: us-east1
  spec:
    inbound:
      uri: trunk05.acme.com
      accessControlListRef: acl-01
    outbound:
      sendRegister: true
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-tls
            host: sip.provider.net
            port: 5062
            transport: tls
          priority: 10
          weight: 10
          enabled: true
