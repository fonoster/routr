- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-01
  metadata:
    name: Test Trunk
    region: us-east1
  spec:
    inbound:
      uri: trunk01.acme.com
      accessControlListRef: acl-01
    outbound:
      sendRegister: true
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 7060
            transport: udp
          priority: 10
          weight: 10
          enabled: true

- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-02
  metadata:
    name: Test Trunk2
    region: us-east1
  spec:
    # Calls through this trunk carry +E.164 users, and calls leaving through it
    # present the Number as the caller (SC-IT.Conf.1.3.1)
    enforceE164: true
    rewriteFromWithNumber: true
    inbound:
      uri: trunk02.acme.com
      accessControlListRef: acl-01
      credentialsRef: credentials-04
    outbound:
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 7060
            transport: udp
          priority: 10
          weight: 10
          enabled: true

- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-03
  metadata:
    name: Test Trunk3
    region: us-west1
  spec:
    inbound:
      uri: trunk03.acme.com
      credentialsRef: credentials-04
    outbound:
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 7060
            transport: udp
          priority: 10
          weight: 10
          enabled: true

# Reaches the Service Provider over TLS. The provider is the SEET fake carrier, which
# serves the certificate from etc/certs on 5061 (see .scripts/dev-certs.sh).
- apiVersion: v2beta1
  kind: Trunk
  ref: trunk-04
  metadata:
    name: Test Trunk4 (TLS)
    region: us-east1
  spec:
    inbound:
      uri: trunk04.acme.com
      accessControlListRef: acl-01
    outbound:
      credentialsRef: credentials-04
      uris:
        - uri:
            user: pbx-1
            host: sip.provider.net
            port: 5061
            transport: tls
          priority: 10
          weight: 10
          enabled: true
