kind: EdgePort
apiVersion: v2beta1
ref: edgeport-02
metadata:
  region: default
logLevel: debug
telemetry:
  otlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
spec:
  unknownMethodAction: Discard
  processor:
    addr: dispatcher:51901
  securityContext:
    client:
      authType: DisabledAll
    keyStorePassword: changeme
    keyStore: "/etc/routr/certs/signaling.p12"
    keyStoreType: pkcs12
  externalAddrs:
    - 10.111.220.3
    - sip02.edgeport.net
  localnets:
    - 127.0.0.1/8
    - 10.111.221.3/24
  methods:
    - REGISTER
    - MESSAGE
    - INVITE
    - ACK
    - BYE
    - CANCEL
    - OPTIONS
  transport:
    - protocol: tcp
      port: 6060
    - protocol: udp
      port: 6060
    - protocol: tls
      port: 6061
    - protocol: ws 
      port: 6062
    - protocol: wss
      port: 6063
