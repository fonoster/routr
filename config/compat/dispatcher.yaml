# Dispatcher configuration for the known-good corpus compatibility run
# (scripts/compat.sh): the services on localhost, no recording.
kind: MessageDispatcher
apiVersion: v3
ref: message-dispatcher
spec:
  bindAddr: 0.0.0.0:51901
  processors:
    - ref: connect-processor
      addr: localhost:51904
      matchFunc: req => true
      methods:
        - REGISTER
        - MESSAGE
        - INVITE
        - ACK
        - BYE
        - CANCEL
        - REFER
        - NOTIFY
