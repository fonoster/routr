# routr.yaml: the one configuration RoutrOne reads (ROUTR3.md § 3.7). A
# standalone component reads its own section. A value is a literal, a ${VAR}
# or ${VAR:-default} placeholder, or a secret:// reference (secret://env/NAME,
# secret://file/<path>, secret://k8s/[<namespace>/]<secret>#<key>); nothing is
# read from the environment without one. Every component section takes a
# bindAddr, where its gRPC service listens: absent is its Routr 2 port, an
# empty string turns the listener off. To replay with rctl trace, publish the
# Dispatcher's port (51901) and set spec.connect.nonceMaxAge to 0: the recordings
# answer the challenges issued when they were made.
apiVersion: v3
kind: Routr
ref: routr-01
metadata:
  region: default
# debug, info (the default), warn or error
logLevel: info
# Traces, metrics and logs over OTLP/HTTP; empty or absent is off
# telemetry:
#   otlpEndpoint: http://otel-lgtm:4318
#   sampleRatio: 1
spec:
  # The EdgePort spec of Routr 2's edgeport.yaml, unchanged, minus
  # spec.processor: RoutrOne dispatches in process.
  edgeport:
    unknownMethodAction: Discard
    securityContext:
      client:
        authType: DisabledAll
      keyStorePassword: changeme
      keyStore: /etc/routr/certs/signaling.p12
      keyStoreType: pkcs12
    externalAddrs:
      - 10.111.220.2
    localnets:
      - 127.0.0.1/8
      - 10.111.221.2/24
    # What Connect takes; any other method is answered 501. The default is Routr 2's
    # RoutrOne list:
    methods:
      - REGISTER
      - INVITE
      - ACK
      - BYE
      - CANCEL
      - REFER
      - NOTIFY
    transport:
      - protocol: tcp
        port: 5060
      - protocol: udp
        port: 5060
      - protocol: tls
        port: 5061
      - protocol: ws
        port: 5062
      - protocol: wss
        port: 5063
  # The Dispatcher's Processor service, for an external EdgePort
  # (bindAddr: 0.0.0.0:51901 by default)
  dispatcher: {}
    # One JSONL file per call, read with rctl trace. The directory must be writable by
    # the image's user; /var/routr/traces is. Replace the {} above to turn it on:
    # recording:
    #   enabled: true
    #   path: /var/routr/traces
    #   mode: flagged
  connect:
    # The Connect processor, for an external Dispatcher (0.0.0.0:51904)
    # bindAddr: 0.0.0.0:51904
    # How long a digest nonce stays valid, in seconds; 0 accepts any nonce
    nonceMaxAge: 300
    # The expiry granted to a REGISTER that names none
    registerDefaultExpires: 3600
    # What a Connect Token verified with verifierPublicKeyPath must carry
    # verifierPublicKeyPath: /etc/routr/verifier.pem
    # verifierIssuer: https://issuer.example.com
    # verifierAudience: routr
  location:
    # The Location service (0.0.0.0:51902)
    # bindAddr: 0.0.0.0:51902
    # memory, or redis when instances share bindings:
    #   provider: redis
    #   parameters: host=redis,port=6379
    cache:
      provider: memory
  data:
    # The Data API, what rctl and the SDK reach (0.0.0.0:51907)
    # bindAddr: 0.0.0.0:51907
    # files reads the resources directory; postgres needs url and, for the
    # passwords Routr 2 encrypted, encryptionKey:
    #   backend: postgres
    #   url: secret://env/DATABASE_URL
    #   encryptionKey: secret://file/var/run/routr/secrets/cloak
    backend: files
    path: /etc/routr/resources
  # The Requester, which runs only with spec.registry. Its gRPC service: bindAddr,
  # 0.0.0.0:51909 by default. sipHost is where its SIP listening points bind, what
  # Via and Contact name and the source of every REGISTER, the one source Connect
  # honors a Trunk's X-Gateway-Auth from. With spec.registry it must be an IP that
  # isn't loopback or unspecified; absent is the host's local IP.
  requester:
    sipHost: 10.111.221.2
  # The periodic REGISTER of the Trunks that ask for one, through the Requester;
  # absent turns it off
  registry:
    # Seconds between rounds, 60 by default
    registerInterval: 60
    # The Allow headers of the REGISTER
    methods:
      - INVITE
      - MESSAGE
    # Where a REGISTER leaves through; the first one is used
    edgePorts:
      - address: 10.111.221.2:5060
  # The RTPRelay, in process after Connect, driving this RTPEngine; absent is no relay
  # rtprelay:
  #   host: rtpengine
  #   port: 22222
  # GET /healthz for an orchestrator; absent is off, and the port is 8080 by default
  # health:
  #   bindAddr: 0.0.0.0:8080
