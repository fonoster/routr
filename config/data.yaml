# The Data API's configuration for the compose stack (Routr 3): spec.data of routr.yaml
# (ROUTR3.md § 3.7) on its own. The files backend reads the resources config/resources
# holds, mounted at /etc/routr/resources by compose.yaml, as Routr 2's simpledata did.
# Run on the host, .scripts/runner.ts and start:data point ROUTR_RESOURCES at them.
apiVersion: v3
kind: Routr
logLevel: debug
telemetry:
  otlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
spec:
  data:
    backend: files
    path: ${ROUTR_RESOURCES:-/etc/routr/resources}
    bindAddr: 0.0.0.0:51907
    # The compose network is the boundary here: 51907 is exposed to the other containers
    # and published to nobody. Beyond this stack, take this out and authenticate callers:
    #   apiKeys: [secret://env/ROUTR_API_KEY]    # sent as authorization: Bearer <key>
    #   tls: { certFile: /etc/routr/certs/server.crt, keyFile: /etc/routr/certs/server.key }
    #   # or mTLS: tls.clientCAFile. Either suffices. Clients: spec.apiAuth in their files.
    insecure: true
