kind: EdgePort
apiVersion: v3
ref: default
metadata:
  region: default
spec:
  unknownMethodAction: Discard
  processor:
    addr: localhost:51901
  securityContext:
    client:
      authType: DisabledAll
    certFile: /etc/routr/certs/server.crt
    keyFile: /etc/routr/certs/server.key
  methods:
    - REGISTER
    - MESSAGE
    - INVITE
    - ACK
    - BYE
    - CANCEL
    - REFER
    - NOTIFY
    - OPTIONS
  transport:
    - protocol: tcp
      port: 5060
    - protocol: udp
      port: 5060
    - protocol: tls
      port: 5061
    - protocol: ws 
      port: 5062
    - protocol: wss
      port: 5063
