- apiVersion: v2beta1
  kind: Domain
  ref: domain-01
  metadata:
    name: Local Domain
  spec:
    accessControlListRef: acl-01
    context:
      domainUri: sip.local
      egressPolicies:
        - rule: ".*"
          numberRef: number-01

# Recordings that use the WhatsApp entries below live in interop/whatsapp/.
- apiVersion: v2beta1
  kind: Domain
  ref: domain-wa
  metadata:
    name: WhatsApp Dialer Domain
  spec:
    context:
      domainUri: wp.local
      egressPolicies:
        - rule: ".*"
          numberRef: number-wa
